apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ../base only; no nameSuffix, no label override, no args patch. Every arm
# renders the same object names because the campaign applies them sequentially.
resources:
  - ../base
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: "llama-3-1-8b-instruct"
    path: gpu-patch.yaml
