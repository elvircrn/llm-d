# Qwen3-4B-Instruct-2507 as a prefill/decode pair, one GPU per rank, served
# through the RHOAI operator. Unlike the plain qwen3-4b-pd guide, each serving
# container states its own `bash -c` command with a single script argument:
# that is the shape a campaign's vLLM wheel build prepends its install line
# to, so a source build lands in this pod before `vllm serve` starts. The
# extra group 0 is what lets that install write into the image's venv.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-4b-pr
spec:
  baseRefs: []
  labels:
    llm-d.ai/model: Qwen3-4B-Instruct
  model:
    uri: hf://Qwen/Qwen3-4B-Instruct-2507
    name: Qwen/Qwen3-4B-Instruct-2507
  replicas: 1
  parallelism:
    tensor: 1
  router:
    gateway:
      refs:
        - name: openshift-ai-inference
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        command: ["/bin/bash", "-c"]
        args:
          - |
            NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
            if [ "$#" -gt 0 ]; then set -- "$0" "$@"; fi
            exec vllm serve /mnt/models \
              --served-model-name Qwen/Qwen3-4B-Instruct-2507 "publishers/${NS}/models/Qwen/Qwen3-4B-Instruct-2507" \
              --port 8001 \
              --root-path /ecrncevi-pirate/qwen3-4b-pr \
              --load-format dummy \
              --enforce-eager \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}' \
              --enable-ssl-refresh \
              --ssl-certfile /var/run/kserve/tls/tls.crt \
              --ssl-keyfile /var/run/kserve/tls/tls.key \
              "$@"
        securityContext:
          runAsGroup: 0
        startupProbe:
          httpGet:
            path: /health
            port: 8001
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 180
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
            scheme: HTTPS
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 256Gi
            nvidia.com/gpu: "1"
  prefill:
    replicas: 1
    labels:
      llm-d.ai/model: Qwen3-4B-Instruct
    parallelism:
      tensor: 1
    template:
      containers:
        - name: main
          command: ["/bin/bash", "-c"]
          args:
            - |
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              if [ "$#" -gt 0 ]; then set -- "$0" "$@"; fi
              exec vllm serve /mnt/models \
                --served-model-name Qwen/Qwen3-4B-Instruct-2507 \
                --port 8000 \
                --root-path /ecrncevi-pirate/qwen3-4b-pr \
                --load-format dummy \
                --enforce-eager \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}' \
                "$@"
          securityContext:
            runAsGroup: 0
          startupProbe:
            httpGet:
              path: /health
              port: 8001
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
