# DeepSeek-R1 NVFP4 disaggregated P/D serving on GB200 NVL72: layer after
# guides/recipes/router/base.values.yaml. Prefill always goes to a prefill
# engine and decode to a decode engine (always-disagg-pd-decider); prefill
# picks by strict prefix-cache affinity (maxTTFTPenaltyMs 0 turns the
# TTFT-penalty load override off, so a cache-warm prefill engine is never
# traded for a less loaded cold one) and then queued token load, decode
# picks the least busy engine. The gb200 model servers run
# --data-parallel-hybrid-lb, so every role serves all DP ranks behind one
# port: prefill engines on 8000 and the decode routing sidecar on 8000.
router:
  # The chart's Service exposes only 9002/9090/8081; benchmark clients call
  # http://<release>-epp.<ns>.svc.cluster.local/v1 on port 80, so map it to
  # the Envoy sidecar (wide-ep.values.yaml does the same for the pd guides).
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: the inflight-load-producer's in-flight token
    # accounting (which the token-load-scorer and affinity filter consume)
    # is local to each EPP process, so multiple replicas would each see
    # only a fraction of the per-endpoint load and incorrectly gate the
    # affinity filter.
    replicas: 1
    pluginsConfigFile: "r1-nvfp4-pd-config.yaml"
    pluginsCustomConfig:
      r1-nvfp4-pd-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            # R1's context window is 163840 tokens; the default window is 128k.
            maxPrefixTokensToMatch: 163840
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            affinityThreshold: 0.5
            # 0 = strict affinity: the TTFT-penalty load override is off.
            maxTTFTPenaltyMs: 0
            peakPrefillThroughput: 3000
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker

  modelServers:
    # All DP ranks sit behind the engine's hybrid LB on a single port per
    # pod: prefill's vllm serve --port 8000 and decode's routing sidecar
    # --port 8000.
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: DeepSeek-R1
