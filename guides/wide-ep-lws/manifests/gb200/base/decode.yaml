apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-llm-d-decode
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: DeepSeek-R1
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: DeepSeek-R1
          llm-d.ai/role: decode
      spec:
        serviceAccountName: deepseek-r1
        # DeepEP low-latency MNNVL buffers allocate CU_MEM_HANDLE_TYPE_FABRIC
        # memory; the driver refuses that without membership in a compute domain.
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: llm-d-dev-claim
        initContainers:
          - name: routing-proxy
            args:
              - --port=8000
              - --vllm-port=8200
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.11.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
            resources: {}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi # 2Gi for NCCL 2.27 to be safe
        containers:
          - name: vllm
            image: ghcr.io/llm-d/llm-d:v0.2.0
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                #################
                # RUN vLLM decode worker
                #################
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                if [ -f /opt/vllm/bin/activate ]; then source /opt/vllm/bin/activate; fi
                exec vllm serve \
                  nvidia/DeepSeek-R1-NVFP4 \
                  --port 8200 \
                  --disable-uvicorn-access-log \
                  --enable-expert-parallel \
                  --data-parallel-hybrid-lb \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --trust-remote-code \
                  --kv_transfer_config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            env:
              # Weights load from the lustre HF cache; the 64Gi ephemeral-storage
              # limit evicts any worker that downloads them locally. The path is
              # the build-cache mount the campaign injects for the deepep build.
              - name: HF_HUB_CACHE
                value: /shared/vllm-build
              - name: HF_HUB_DISABLE_XET
                value: "1"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: HF_TOKEN
              - name: VLLM_DEEPEP_LOW_LATENCY_ALLOW_NVLINK
                value: "1"
              - name: VLLM_DEEPEP_LOW_LATENCY_USE_MNNVL
                value: "1"
              - name: VLLM_FUSED_MOE_CHUNK_SIZE
                value: "1024"
              - name: DP_SIZE_LOCAL
                value: "4"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: VLLM_ALL2ALL_BACKEND
                value: deepep_low_latency
              - name: NVIDIA_GDRCOPY
                value: enabled
              # Pods on this cluster get no /dev/infiniband; once CUDA is up,
              # UCX's default rc_verbs probe kills ucp worker creation and
              # NIXL dies with NIXL_ERR_BACKEND. Keep NIXL on the pod network.
              - name: UCX_TLS
                value: tcp,cuda_copy,sm
              # Override container default that disables VMM
              # VMM is required for fabric memory / MNNVL cross-pod communication
              - name: NVSHMEM_DISABLE_CUDA_VMM
                value: "0"
              - name: NVSHMEM_DEBUG
                value: INFO
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_IB_HCA
                value: ibp
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            ports:
              - containerPort: 8200
                name: metrics
                protocol: TCP
            readinessProbe:
              httpGet:
                path: /health
                port: 8200
            resources:
              claims:
                - name: compute-domain-channel
              limits:
                ephemeral-storage: 256Gi
                memory: 512Gi
                nvidia.com/gpu: "4"
              requests:
                cpu: 32
                ephemeral-storage: 256Gi
                memory: 512Gi
                nvidia.com/gpu: "4"
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
            workingDir: /code
