apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# EP32/EP32 PD topology: 1 prefill worker-group of size 4 (4 nodes x
# TP1/DP8-local = DP32/EP32) + 1 decode worker-group of size 4 (same) ->
# 8 nodes / 64 GPUs total.
resources:
  - ../../providers/coreweave
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 4
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 4
