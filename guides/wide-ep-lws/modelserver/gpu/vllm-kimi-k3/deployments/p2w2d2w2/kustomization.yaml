apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kimi-K3: 2 prefill replicas (DEP16 each, 2 nodes) + 2 decode replicas (DEP16, 2 nodes each) -> 8 nodes / 64 GPUs.
resources:
  - ../../providers/coreweave
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
