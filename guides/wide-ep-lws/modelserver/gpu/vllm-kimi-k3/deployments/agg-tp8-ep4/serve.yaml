apiVersion: v1
kind: ServiceAccount
metadata:
  name: kimi-k3
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-kimi-k3
  labels:
    llm-d.ai/model: Kimi-K3
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 4
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: Kimi-K3
      spec:
        serviceAccountName: kimi-k3
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/model: Kimi-K3
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1500Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf-cache
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local/jit-cache
              type: DirectoryOrCreate
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
        containers:
          - name: vllm
            image: vllm/vllm-openai:nightly
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                VLLM_SITE=$(python3 -c "import vllm, pathlib; print(pathlib.Path(vllm.__file__).parent)")

                # Cherry-pick vllm PR 50511: MoE padding-row fix for DeepEP v2
                PR_SHA=8b3f9dd33ee4f65c0c0b16b4527ebf5fb768ecd1
                for f in \
                  model_executor/layers/fused_moe/experts/triton_moe.py \
                  model_executor/layers/fused_moe/moe_fused_mul_sum.py \
                  model_executor/layers/fused_moe/prepare_finalize/deepep_v2.py \
                  model_executor/layers/fused_moe/utils.py; do
                  curl -sL "https://raw.githubusercontent.com/vllm-project/vllm/${PR_SHA}/vllm/${f}" \
                    -o "${VLLM_SITE}/${f}"
                done
                echo "Applied PR 50511 (${PR_SHA:0:8})"

                # Cherry-pick vllm PR 50510: enable SiTU activation in humming MoE backend
                sed -i '/MoEActivation.SWIGLUOAI,/a\            MoEActivation.SITU,' \
                  "${VLLM_SITE}/model_executor/layers/fused_moe/experts/fused_humming_moe.py"
                echo "Applied PR 50510 (humming SiTU)"

                # MLA dcp_world_size lazy-init workaround (fixes cp_world_size must be positive)
                MLA_PY="${VLLM_SITE}/models/kimi_k3/nvidia/mla.py"
                if [ -f "$MLA_PY" ] && ! grep -q "dcp_world_size" "$MLA_PY"; then
                  sed -i 's/            latent_out, _lse = self.impl.forward_mqa(/            if getattr(self.impl, "dcp_world_size", 1) == -1:\n                try:\n                    from vllm.distributed.parallel_state import get_dcp_group\n                    self.impl.dcp_world_size = get_dcp_group().world_size\n                except (AssertionError, Exception):\n                    self.impl.dcp_world_size = 1\n            latent_out, _lse = self.impl.forward_mqa(/' "$MLA_PY"
                  echo "Patched mla.py (dcp_world_size)"
                fi

                GPU_MEM_UTIL=${GPU_MEM_UTIL:-0.90}

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                exec vllm serve \
                  mgoin/Kimi-K3-pruned75 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --max-model-len ${MAX_MODEL_LEN:-8192} \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-external-lb \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-rank $START_RANK \
                  --all2all-backend deepep_v2 \
                  --language-model-only \
                  --attention-backend FLASHMLA \
                  --moe-backend humming \
                  --disable-custom-all-reduce \
                  --no-enable-flashinfer-autotune \
                  --max-num-batched-tokens 4096 \
                  --max-num-seqs 256
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: GPU_MEM_UTIL
                value: ""
              - name: MAX_MODEL_LEN
                value: "8192"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: "expandable_segments:True"
              - name: NCCL_DMABUF_ENABLE
                value: "0"
              - name: NCCL_IB_HCA
                value: "ibp"
              - name: NVSHMEM_HCA_PREFIX
                value: "ibp"
            ports:
              - containerPort: 8000
                name: dp0
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: dp0
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: dp0
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: dp0
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
                rdma/ib: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
                rdma/ib: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: hf-cache
                mountPath: /mnt/hf-cache
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
