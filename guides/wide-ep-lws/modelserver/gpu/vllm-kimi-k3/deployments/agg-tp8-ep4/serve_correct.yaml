# serve_correct.yaml
#
# Direct verification build for vLLM PR 51332 (Humming MXFP4 weight +
# block-FP8 g128 activation MoE):
#   https://github.com/vllm-project/vllm/pull/51332
#
# Unlike prior revisions of this file, this does NOT overlay a handful of Python
# files or JIT-compile a standalone situ .so. At boot each pod does a FULL
# from-source build of PR 51332 -- a slow `uv pip install` of the whole project
# -- so what runs is exactly the PR, Python AND compiled _C.so, with no ad-hoc
# patches. The point is to test whether PR 51332 alone is correct.
#
# The built wheel is cached on the persistent jit-cache volume keyed by the PR
# head SHA, so only the FIRST pod on a node pays the ~30 min compile; restarts
# reinstall the cached wheel in seconds. The head SHA is resolved at boot via
# `git ls-remote` (no manual bump): push to the PR, redeploy, and the new commit
# is picked up automatically; an unchanged head reuses the cached wheel.
#
# The build uses --no-build-isolation so it links against the image's existing
# torch (ABI-matched); nvcc ships in the base image. TORCH_CUDA_ARCH_LIST=9.0
# restricts codegen to Hopper (H200) to keep the compile time down.
#
# NOTE: uses the same LeaderWorkerSet name as serve.yaml, so applying this is a
# drop-in replacement of the dummy deployment (the cluster only has room for one).
#
# ============================================================================
# HOW TO DEPLOY
# ============================================================================
#   1. Push your change to PR 51332 (nothing to edit here -- the boot script
#      resolves the PR head SHA via `git ls-remote`, so a new commit auto-
#      invalidates the wheel cache and rebuilds).
#   2. Deploy:  cd ~/glm/llm-d && KUBECONFIG=~/.kube/config.kermit \
#                 ./deploy-kimi-k3-correct.sh
#      (apply is a rolling replace of the same LWS name; do NOT delete-and-
#      recreate.)
#   3. Watch:   kubectl -n elvircrn-kimi-k3 get pods -l llm-d.ai/model=Kimi-K3 -w
#      The first boot sits in the build for a while; follow it with
#        kubectl -n elvircrn-kimi-k3 logs -f <pod> -c vllm 2>&1 | grep -i build
#      NB: vLLM logs to STDERR -- when grepping `kubectl logs`, use `2>&1 |`,
#      never `2>&1 > file` (that mis-orders redirects and drops all stderr).
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kimi-k3
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-kimi-k3
  labels:
    llm-d.ai/model: Kimi-K3
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 4
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: Kimi-K3
      spec:
        serviceAccountName: kimi-k3
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/model: Kimi-K3
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1500Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf-cache
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local/jit-cache
              type: DirectoryOrCreate
          # Shared RWX (shared-vast) build cache -- node-independent, so a pod that
          # reschedules to another node still finds the cached wheel instead of
          # recompiling. Holds only the published wheels + build logs.
          - name: build-cache
            persistentVolumeClaim:
              claimName: kimi-k3-build-cache
          - name: profile-traces
            hostPath:
              path: /mnt/local/vllm-profile
              type: DirectoryOrCreate
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
        containers:
          - name: vllm
            # PINNED by digest, NOT :nightly. :nightly is a floating tag +
            # imagePullPolicy: Always, so the 4 LWS pods can each pull a DIFFERENT
            # nightly. That breaks two invariants this deployment now relies on:
            #   1. The from-source wheel is built ONCE and cached on the shared
            #      (shared-vast) volume, then installed on all 4 pods. It is built
            #      --no-build-isolation against the base image's torch, so every pod
            #      MUST have the same torch/ABI or the shared wheel mismatches.
            #   2. We reuse prebuilt .so files (FlashMLA/FA/DeepGEMM) straight from
            #      the base image; those must match the wheel's torch too.
            # A floating base also reintroduces the classic cross-node skew (e.g.
            # differing dp_utils.py all-reduce tensor row counts -> gloo size
            # mismatch at startup). Pin the digest so all pods are byte-identical.
            # This is the digest all 4 pods were running as of 2026-08-17; bump it
            # deliberately (and redeploy all pods together) to move to a new base.
            image: vllm/vllm-openai:nightly
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
                  - SYS_ADMIN  # required for `ncu` (Nsight Compute) to access GPU perf counters
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                # Single integration branch: PR 51332 with the profiling-QoL
                # commits rebased on top. Rebase + force-push it locally; no
                # boot-time merge.
                BUILD_REPO=https://github.com/elvircrn/vllm.git
                # BUILD_BRANCH=kimi-merged-perf
                # BUILD_BRANCH=humming-mxfp4-w4a8-block-fp8
                BUILD_BRANCH=humming-deepep-fused-rebased
                # Bump when the build RECIPE changes (flags, prunes) -- part of the
                # cache key, so a bump forces a rebuild for the same branch SHA.
                # EXPERIMENT: reproduce the known-good 0.94 recipe, which was a
                # fastmath build. Bump the cache key AND wire --use_fast_math below
                # (the variant string alone is only a cache key, not a flag).
                BUILD_VARIANT=release-fastmath-qol1
                command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1; }
                BUILD_SHA=$(git ls-remote "$BUILD_REPO" "$BUILD_BRANCH" | cut -f1)
                if [ -z "$BUILD_SHA" ]; then
                  echo "FATAL: could not resolve ${BUILD_BRANCH} via ls-remote."
                  exit 1
                fi
                echo "Building ${BUILD_BRANCH}: ${BUILD_SHA}"
                # WHEEL cache on the shared-vast RWX PVC (mounted at /shared/vllm-build),
                # NOT per-node hostPath -- a rescheduled/recycled pod still finds the
                # cached wheel. ccache stays local. Key on the branch SHA so a push
                # auto-invalidates.
                KEY="${BUILD_SHA:0:12}-${BUILD_VARIANT}"
                CACHE=/shared/vllm-build/pr_build/${KEY}
                WHEEL_DIR="${CACHE}/wheel"

                command -v uv >/dev/null 2>&1 || python3 -m pip install -q uv

                SITE=$(cd / && python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
                # third_party/flashmla holds the FlashMLA python interface
                # (flash_mla_interface.py) that vllm.v1.attention.ops.flashmla imports.
                # Pruning the _flashmla_C CMakeExtension skips the cmake step that
                # installs BOTH the .so AND these .py files, so reuse the whole dir
                # from the base image alongside the compiled .so (REUSE_FILES).
                REUSE_DIRS="vllm_flash_attn third_party/deep_gemm third_party/flashmla"
                # Prebuilt extension .so files reused straight from the base image
                # (PR 51332 doesn't touch FlashMLA attention). Building _flashmla_C
                # from source is the slow tail of the compile -- its cost is nvcc's
                # single-threaded DEVICE link (nvlink/whole-program SASS), which mold
                # cannot speed up (mold only drives the host link). Pruned from
                # ext_modules below and restored from the stash after install.
                REUSE_FILES="_flashmla_C.abi3.so _flashmla_extension_C.abi3.so"
                rm -rf /tmp/base_reuse
                for d in $REUSE_DIRS; do
                  if [ -d "${SITE}/vllm/${d}" ]; then
                    mkdir -p "/tmp/base_reuse/$(dirname "$d")"
                    cp -r "${SITE}/vllm/${d}" "/tmp/base_reuse/${d}"
                  fi
                done
                mkdir -p /tmp/base_reuse
                for f in $REUSE_FILES; do
                  [ -f "${SITE}/vllm/${f}" ] && cp "${SITE}/vllm/${f}" "/tmp/base_reuse/${f}"
                done

                NEED_BUILD=1
                if ls "${WHEEL_DIR}"/vllm-*.whl >/dev/null 2>&1; then
                  WHEEL=$(ls -t "${WHEEL_DIR}"/vllm-*.whl | head -1)
                  # Validate the cached wheel is a complete, readable zip before
                  # trusting it -- a partially-published / NFS-truncated wheel
                  # otherwise fails the install fatally on every restart. On
                  # corruption (or a failed install), delete it and fall through
                  # to a fresh build instead of crash-looping.
                  if python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile('$WHEEL') and zipfile.ZipFile('$WHEEL').testzip() is None else 1)" 2>/dev/null; then
                    echo "Installing cached vLLM wheel for ${BUILD_BRANCH} (${BUILD_SHA}): $(basename "$WHEEL")"
                    if uv pip install --system --force-reinstall --no-deps "$WHEEL"; then
                      NEED_BUILD=0
                    else
                      echo "WARN: cached vLLM wheel install failed; removing and rebuilding: $WHEEL"
                      rm -f "$WHEEL"
                    fi
                  else
                    echo "WARN: cached vLLM wheel is corrupt; removing and rebuilding: $WHEEL"
                    rm -f "$WHEEL"
                  fi
                fi
                if [ "$NEED_BUILD" = 1 ]; then
                  apt-get update -qq && apt-get install -y -qq ccache mold > /dev/null 2>&1
                  # Do NOT nuke "$CACHE" here -- it's the SHARED wheel dir; another
                  # pod may be publishing into it concurrently. Only clear our own
                  # local scratch.
                  rm -rf /tmp/vllm-pr
                  mkdir -p /tmp/vllm-pr && cd /tmp/vllm-pr
                  git init -q
                  git fetch --depth=1 -q "$BUILD_REPO" "$BUILD_SHA" || { echo "FATAL: fetch ${BUILD_BRANCH} failed"; exit 1; }
                  git checkout -q FETCH_HEAD || { echo "FATAL: checkout ${BUILD_BRANCH} failed"; exit 1; }
                  echo "Building ${BUILD_BRANCH} (${BUILD_SHA}); SLOW (~30 min)..."
                  uv pip install --system -q setuptools wheel setuptools_scm setuptools_rust ninja cmake || { echo "FATAL: build-deps install failed"; exit 1; }
                  BASE_VLLM=$(cd / && python3 -c "import vllm, pathlib; print(pathlib.Path(vllm.__file__).parent)")
                  cp -r "${BASE_VLLM}/vllm-rs" vllm/ 2>/dev/null || true
                  cp "${BASE_VLLM}"/_rust_*.so vllm/ 2>/dev/null || true
                  python3 - <<'PYEOF' || { echo "FATAL: setup.py prune failed (recipe drift?)"; exit 1; }
                p = 'setup.py'
                s = open(p).read()
                s = s.replace(
                    '    ext_modules.append(CMakeExtension(name="vllm.vllm_flash_attn._vllm_fa2_C"))\n',
                    '')
                s = s.replace(
                    '        ext_modules.append(CMakeExtension(name="vllm.vllm_flash_attn._vllm_fa3_C"))\n',
                    '        pass\n')
                s = s.replace(
                    '        ext_modules.append(CMakeExtension(name="vllm._deep_gemm_C", optional=True))\n',
                    '')
                s = s.replace(
                    '        ext_modules.append(CMakeExtension(name="vllm._flashmla_C", optional=True))\n'
                    '        ext_modules.append(\n'
                    '            CMakeExtension(name="vllm._flashmla_extension_C", optional=True)\n'
                    '        )\n',
                    '        pass\n')
                open(p, 'w').write(s)
                assert '_vllm_fa2_C")' not in s and '_vllm_fa3_C")' not in s, 'FA prune failed'
                assert '_deep_gemm_C"' not in s, 'DeepGEMM prune failed'
                assert 'name="vllm._flashmla_C"' not in s, 'FlashMLA prune failed'
                print('Pruned FA2/FA3 + DeepGEMM + FlashMLA from setup.py ext_modules')
                PYEOF
                  NVRTC_LIB=$(ls /usr/local/cuda*/lib64/libnvrtc.so 2>/dev/null | head -1)
                  [ -n "$NVRTC_LIB" ] || NVRTC_LIB=$(find /usr/local/cuda* \
                    /usr/local/lib/python3.12/dist-packages/nvidia \
                    -name 'libnvrtc.so*' 2>/dev/null | sort | head -1)
                  if [ -z "$NVRTC_LIB" ]; then
                    echo "FATAL: could not locate libnvrtc for the CUDA build."
                    exit 1
                  fi
                  echo "Using libnvrtc: $NVRTC_LIB"
                  export CMAKE_ARGS="${CMAKE_ARGS:-} -DCUDA_nvrtc_LIBRARY=${NVRTC_LIB}"
                  if command -v mold >/dev/null 2>&1; then
                    export CMAKE_ARGS="${CMAKE_ARGS} -DCMAKE_LINKER_TYPE=MOLD"
                  fi
                  # RELEASE build with the nvcc perf knobs turned up. This is the
                  # dummy-weights / uniform-routing PERF smoke-test variant, so we
                  # trade IEEE-exact numerics for speed:
                  #   Release            -O3 -DNDEBUG, no -g (vs default RelWithDebInfo)
                  #   --use_fast_math    approximate div/sqrt, flush denormals, FMA
                  #                      contraction -- NOT numerically safe; do NOT
                  #                      copy this into serve_correct.yaml.
                  #   -Xptxas -O3        max ptxas optimization (default at O3, explicit)
                  #   --extra-device-vectorization  more aggressive device vectorization
                  #   NVCC_THREADS       parallelize device-side compile per TU
                  # NB: pass the multi-token nvcc flags via CMake's CUDAFLAGS env var,
                  # NOT via CMAKE_ARGS -- vLLM setup.py splits CMAKE_ARGS on plain
                  # whitespace (.split(), no shlex), so a quoted -DCMAKE_CUDA_FLAGS=
                  # value would fragment. CUDAFLAGS initializes CMAKE_CUDA_FLAGS on
                  # first configure and vLLM's CMakeLists appends to it.
                  export CMAKE_BUILD_TYPE=Release
                  export NVCC_THREADS=${NVCC_THREADS:-8}
                  # EXPERIMENT (fastmath variant): match the known-good 0.94 build.
                  export CUDAFLAGS="${CUDAFLAGS:-} -Xptxas -O3 --extra-device-vectorization --use_fast_math"
                  # Build into LOCAL scratch, then atomically publish the finished
                  # wheel to the shared dir. Never let `uv build` write directly into
                  # the shared WHEEL_DIR -- a second pod's cache-hit check could
                  # otherwise glob a half-written .whl. mkdir -p WHEEL_DIR up front so
                  # concurrent builders share the same target dir.
                  mkdir -p "$WHEEL_DIR" "${CACHE}/logs"
                  LOCAL_WHEEL=/tmp/vllm-wheel-out
                  rm -rf "$LOCAL_WHEEL" && mkdir -p "$LOCAL_WHEEL"
                  BUILD_LOG="${CACHE}/logs/build-${HOSTNAME:-$(hostname)}.log"
                  set -o pipefail
                  if TORCH_CUDA_ARCH_LIST=9.0 MAX_JOBS=${MAX_JOBS:-64} \
                       uv build --wheel --no-build-isolation -o "$LOCAL_WHEEL" . 2>&1 | tee "$BUILD_LOG"; then
                    # Atomic publish: copy to a per-pod temp name inside WHEEL_DIR,
                    # then rename into place (same-dir rename is atomic on POSIX/NFS,
                    # so readers see either no wheel or a complete one). The cache-hit
                    # glob only matches vllm-*.whl, so the .tmp is never a false hit.
                    for w in "$LOCAL_WHEEL"/vllm-*.whl; do
                      bn=$(basename "$w")
                      cp "$w" "${WHEEL_DIR}/.${bn}.$$.tmp"
                      mv -f "${WHEEL_DIR}/.${bn}.$$.tmp" "${WHEEL_DIR}/${bn}"
                    done
                    WHEEL=$(ls -t "${WHEEL_DIR}"/vllm-*.whl | head -1)
                    uv pip install --system --force-reinstall --no-deps "$WHEEL" || { echo "FATAL: built wheel install failed"; exit 1; }
                    echo "Built + published vLLM ${BUILD_BRANCH} (${BUILD_SHA}) -> ${WHEEL_DIR}"
                  else
                    echo "FATAL: vLLM ${BUILD_BRANCH} build failed; log at ${BUILD_LOG}; not publishing."
                    exit 1
                  fi
                  cd
                  rm -rf /tmp/vllm-pr "$LOCAL_WHEEL"
                fi

                for d in $REUSE_DIRS; do
                  if [ -d "/tmp/base_reuse/${d}" ]; then
                    rm -rf "${SITE}/vllm/${d}"
                    mkdir -p "$(dirname "${SITE}/vllm/${d}")"
                    cp -r "/tmp/base_reuse/${d}" "${SITE}/vllm/${d}"
                    echo "Restored base-image ${d} into ${SITE}/vllm/${d}"
                  else
                    echo "WARN: no stashed base ${d} to restore (/tmp/base_reuse/${d} missing)"
                  fi
                done
                for f in $REUSE_FILES; do
                  if [ -f "/tmp/base_reuse/${f}" ]; then
                    cp "/tmp/base_reuse/${f}" "${SITE}/vllm/${f}"
                    echo "Restored base-image ${f} into ${SITE}/vllm/${f}"
                  else
                    echo "WARN: no stashed base ${f} to restore (/tmp/base_reuse/${f} missing)"
                  fi
                done

                # ============================================================
                # DeepEP: build the humming-on-vllm-base fork from source with
                # wheel caching (same scheme as the vLLM build above). The wheel
                # is keyed on the branch head SHA + variant and published to the
                # shared RWX PVC, so only the FIRST pod on the cluster compiles;
                # restarts reinstall the cached wheel in seconds. A push to the
                # branch auto-invalidates the cache (new head SHA -> new key).
                # Built --no-build-isolation against the base image's torch, same
                # as vLLM, so the ABI matches. TORCH_CUDA_ARCH_LIST=9.0 -> Hopper.
                # ============================================================
                DEEPEP_REPO=https://github.com/elvircrn/DeepEP.git
                DEEPEP_BRANCH=humming-on-vllm-base
                # Bump when the DeepEP build RECIPE changes (part of the cache key).
                DEEPEP_VARIANT=v1
                DEEPEP_SHA=$(git ls-remote "$DEEPEP_REPO" "$DEEPEP_BRANCH" | cut -f1)
                if [ -z "$DEEPEP_SHA" ]; then
                  echo "FATAL: could not resolve DeepEP ${DEEPEP_BRANCH} via ls-remote."
                  exit 1
                fi
                echo "DeepEP ${DEEPEP_BRANCH}: ${DEEPEP_SHA}"
                DEEPEP_KEY="${DEEPEP_SHA:0:12}-${DEEPEP_VARIANT}"
                DEEPEP_CACHE=/shared/vllm-build/deepep_build/${DEEPEP_KEY}
                DEEPEP_WHEEL_DIR="${DEEPEP_CACHE}/wheel"

                DEEPEP_NEED_BUILD=1
                if ls "${DEEPEP_WHEEL_DIR}"/deep_ep-*.whl >/dev/null 2>&1; then
                  DEEPEP_WHEEL=$(ls -t "${DEEPEP_WHEEL_DIR}"/deep_ep-*.whl | head -1)
                  # Validate the cached wheel (see vLLM note above): rebuild on a
                  # corrupt / partially-published wheel instead of crash-looping.
                  if python3 -c "import zipfile,sys; sys.exit(0 if zipfile.is_zipfile('$DEEPEP_WHEEL') and zipfile.ZipFile('$DEEPEP_WHEEL').testzip() is None else 1)" 2>/dev/null; then
                    echo "Installing cached DeepEP wheel (${DEEPEP_SHA}): $(basename "$DEEPEP_WHEEL")"
                    if uv pip install --system --force-reinstall --no-deps "$DEEPEP_WHEEL"; then
                      DEEPEP_NEED_BUILD=0
                    else
                      echo "WARN: cached DeepEP wheel install failed; removing and rebuilding: $DEEPEP_WHEEL"
                      rm -f "$DEEPEP_WHEEL"
                    fi
                  else
                    echo "WARN: cached DeepEP wheel is corrupt; removing and rebuilding: $DEEPEP_WHEEL"
                    rm -f "$DEEPEP_WHEEL"
                  fi
                fi
                if [ "$DEEPEP_NEED_BUILD" = 1 ]; then
                  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1; }
                  rm -rf /tmp/deepep-src
                  mkdir -p /tmp/deepep-src && cd /tmp/deepep-src
                  git init -q
                  git fetch --depth=1 -q "$DEEPEP_REPO" "$DEEPEP_SHA" || { echo "FATAL: DeepEP fetch failed"; exit 1; }
                  git checkout -q FETCH_HEAD || { echo "FATAL: DeepEP checkout failed"; exit 1; }
                  echo "Building DeepEP ${DEEPEP_BRANCH} (${DEEPEP_SHA})..."
                  uv pip install --system -q setuptools wheel setuptools_scm ninja cmake || { echo "FATAL: DeepEP build-deps install failed"; exit 1; }
                  mkdir -p "$DEEPEP_WHEEL_DIR" "${DEEPEP_CACHE}/logs"
                  DEEPEP_LOCAL=/tmp/deepep-wheel-out
                  rm -rf "$DEEPEP_LOCAL" && mkdir -p "$DEEPEP_LOCAL"
                  DEEPEP_LOG="${DEEPEP_CACHE}/logs/build-${HOSTNAME:-$(hostname)}.log"
                  # DeepEP's JIT wrapper (csrc/jit/compiler.hpp) #includes <nvrtc.h>
                  # and links libnvrtc, but the base image ships these only under the
                  # pip nvidia-cuda-nvrtc dir, not /usr/local/cuda/include. Add the
                  # header dir to CPATH (nvcc's host preprocessor honors it) and the
                  # lib dir to LIBRARY_PATH so the extension compiles + links.
                  NVRTC_HDR=$(find /usr/local/cuda* \
                    /usr/local/lib/python3.12/dist-packages/nvidia \
                    -name 'nvrtc.h' 2>/dev/null | head -1)
                  if [ -n "$NVRTC_HDR" ]; then
                    export CPATH="$(dirname "$NVRTC_HDR"):${CPATH}"
                    echo "Using nvrtc.h: $NVRTC_HDR"
                  else
                    echo "WARN: nvrtc.h not found; DeepEP build may fail."
                  fi
                  NVRTC_SO=$(find /usr/local/cuda* \
                    /usr/local/lib/python3.12/dist-packages/nvidia \
                    -name 'libnvrtc.so*' 2>/dev/null | sort | head -1)
                  if [ -n "$NVRTC_SO" ]; then
                    export LIBRARY_PATH="$(dirname "$NVRTC_SO"):${LIBRARY_PATH}"
                    export LD_LIBRARY_PATH="$(dirname "$NVRTC_SO"):${LD_LIBRARY_PATH}"
                    echo "Using libnvrtc: $NVRTC_SO"
                  fi
                  # DeepEP links NCCL by exact soname (-l:libnccl.so.2), but the
                  # base image may ship only a versioned libnccl.so.2.x.y or place
                  # it off the linker path, so ld can't resolve the bare soname.
                  # Find it and expose a canonical libnccl.so.2 symlink dir on
                  # LIBRARY_PATH (and the real dir on LD_LIBRARY_PATH for runtime).
                  DEEPEP_LINK_DIR=/tmp/deepep-link
                  rm -rf "$DEEPEP_LINK_DIR" && mkdir -p "$DEEPEP_LINK_DIR"
                  NCCL_SO=$(find /usr/local/lib/python3.12/dist-packages/nvidia \
                    /usr/local/cuda* /usr/lib/x86_64-linux-gnu /usr/lib \
                    -name 'libnccl.so.2*' 2>/dev/null | sort | head -1)
                  if [ -n "$NCCL_SO" ]; then
                    ln -sf "$NCCL_SO" "$DEEPEP_LINK_DIR/libnccl.so.2"
                    export LIBRARY_PATH="${DEEPEP_LINK_DIR}:${LIBRARY_PATH}"
                    export LD_LIBRARY_PATH="$(dirname "$NCCL_SO"):${LD_LIBRARY_PATH}"
                    echo "Using libnccl: $NCCL_SO"
                  else
                    echo "WARN: libnccl.so.2 not found; DeepEP link may fail."
                  fi
                  set -o pipefail
                  if TORCH_CUDA_ARCH_LIST=9.0 MAX_JOBS=${MAX_JOBS:-64} NVCC_THREADS=${NVCC_THREADS:-8} \
                       uv build --wheel --no-build-isolation -o "$DEEPEP_LOCAL" . 2>&1 | tee "$DEEPEP_LOG"; then
                    # Atomic publish (same-dir rename), same as the vLLM wheel above.
                    for w in "$DEEPEP_LOCAL"/deep_ep-*.whl; do
                      bn=$(basename "$w")
                      cp "$w" "${DEEPEP_WHEEL_DIR}/.${bn}.$$.tmp"
                      mv -f "${DEEPEP_WHEEL_DIR}/.${bn}.$$.tmp" "${DEEPEP_WHEEL_DIR}/${bn}"
                    done
                    DEEPEP_WHEEL=$(ls -t "${DEEPEP_WHEEL_DIR}"/deep_ep-*.whl | head -1)
                    uv pip install --system --force-reinstall --no-deps "$DEEPEP_WHEEL" || { echo "FATAL: built DeepEP wheel install failed"; exit 1; }
                    echo "Built + published DeepEP ${DEEPEP_BRANCH} (${DEEPEP_SHA}) -> ${DEEPEP_WHEEL_DIR}"
                  else
                    echo "FATAL: DeepEP build failed; log at ${DEEPEP_LOG}; not publishing."
                    exit 1
                  fi
                  cd
                  rm -rf /tmp/deepep-src "$DEEPEP_LOCAL"
                fi

                # Bump the engine<->frontend startup handshake timeout (hardcoded
                # 5 min in vllm/v1/engine/core.py -- no env/flag). Heavy multinode
                # boot + slow W4A8 weight load can blow past 5 min before the
                # front-end answers. Patch the installed file each boot (idempotent,
                # works with the cached wheel too -- no rebuild needed).
                python3 - <<'PYEOF' || { echo "FATAL: HANDSHAKE_TIMEOUT_MINS patch failed"; exit 1; }
                import re, pathlib, vllm
                p = pathlib.Path(vllm.__file__).parent / "v1/engine/core.py"
                s = p.read_text()
                s2 = re.sub(r'HANDSHAKE_TIMEOUT_MINS = \d+', 'HANDSHAKE_TIMEOUT_MINS = 60', s)
                assert s2 != s, "HANDSHAKE_TIMEOUT_MINS patch did not match"
                p.write_text(s2)
                print("Patched HANDSHAKE_TIMEOUT_MINS -> 60")
                PYEOF

                GPU_MEM_UTIL=${GPU_MEM_UTIL:-0.85}

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
                
                sleep infinity

                exec vllm serve \
                  moonshotai/Kimi-K3 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --max-model-len auto \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-external-lb \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-rank $START_RANK \
                  --all2all-backend deepep_v2 \
                  --language-model-only \
                  --attention-backend FLASHMLA \
                  --moe-backend humming \
                  --disable-custom-all-reduce \
                  --no-enable-flashinfer-autotune \
                  --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-1024} \
                  --max-num-seqs 128 \
                  --enable-auto-tool-choice \
                  --tool-call-parser kimi_k3 \
                  --reasoning-parser kimi_k3
            env:
              - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
                value: "18000000"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: GPU_MEM_UTIL
                value: ""
              # Multimodal: MMMU asks for 65536 output tokens; leave headroom for
              # prompt + image tokens. Raise if you see "longer than max_model_len".
              - name: MAX_MODEL_LEN
                value: "131072"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: VLLM_HUMMING_WIDEN_MOE_WARP_N
                value: "1"
              - name: VLLM_DEEPEP_DISABLE_FUSED_MOE_ALIGN
                value: "1"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              # Enables the Humming MXFP4-weight + block-FP8 (group-128) activation
              # MoE path from PR 51332. With this set, a_dtype becomes float8e4m3 so
              # activations are quantized to block FP8 *before* the DeepEP v2
              # all-to-all -- FP8 (+fp32 scales), not BF16, crosses the interconnect.
              # Without it the path is inert (BF16 dispatch, W4A16 GEMM).
              - name: VLLM_HUMMING_INPUT_QUANT_CONFIG
                value: '{"dtype":"float8e4m3","group_size":128}'
              # Cap the small-M MoE tuning K-block at 128 (default on). The BK=256
              # tiles Humming selects for small valid_shape_m build a TMA
              # CUtensorMap the driver rejects at cuLaunchKernelEx
              # (CUDA_ERROR_MISALIGNED_ADDRESS) in profile_run -- not avoidable
              # with --enforce-eager. Set to "0" to test whether a newer
              # Humming/driver no longer needs the cap (would then let us drop it).
              - name: VLLM_HUMMING_CAP_MOE_TUNING_K_BLOCK
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: VLLM_MAX_STOP_STRINGS
                value: "4"
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: VLLM_COMPUTE_NANS_IN_LOGITS
                value: "1"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: "expandable_segments:True"
              - name: NCCL_DMABUF_ENABLE
                value: "0"
              - name: NCCL_IB_HCA
                value: "ibp"
              - name: NVSHMEM_HCA_PREFIX
                value: "ibp"
            ports:
              - containerPort: 8000
                name: dp0
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: dp0
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: dp0
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: dp0
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
                rdma/ib: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
                rdma/ib: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: build-cache
                mountPath: /shared/vllm-build
              - name: hf-cache
                mountPath: /mnt/hf-cache
              - name: profile-traces
                mountPath: /tmp/vllm_profile
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
