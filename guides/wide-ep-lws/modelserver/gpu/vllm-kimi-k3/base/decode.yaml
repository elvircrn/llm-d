apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-kimi-k3-decode
  labels:
    llm-d.ai/model: Kimi-K3
    llm-d.ai/role: decode
spec:
  replicas: ${DECODE_REPLICAS}
  leaderWorkerTemplate:
    size: ${DECODE_SIZE}
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: Kimi-K3
          llm-d.ai/role: decode
      spec:
        serviceAccountName: kimi-k3
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: decode
                      llm-d.ai/model: Kimi-K3
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        initContainers:
          - name: routing-proxy
            args:
              - --port=8000
              - --vllm-port=8200
              - --data-parallel-size=1
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 256Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf-cache
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local/jit-cache
              type: DirectoryOrCreate
          # Shared RWX (shared-vast) build cache -- node-independent, so a pod that
          # reschedules to another node still finds the cached wheel instead of
          # recompiling. Holds only the published wheels + build logs. Same PVC
          # (and cache keys) as agg-tp8-ep4/serve_correct.yaml, so a wheel built by
          # either deployment is reused by the other.
          - name: build-cache
            persistentVolumeClaim:
              claimName: kimi-k3-build-cache
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          # Shared vLLM/Humming build script -- see base/humming-build.sh.
          - name: humming-build
            configMap:
              name: humming-build
              defaultMode: 0555
        containers:
          - name: vllm
            # PINNED by digest, NOT :nightly -- see agg-tp8-ep4/serve_correct.yaml
            # for why (shared from-source wheel requires byte-identical torch/ABI
            # across every pod in both the prefill and decode LWSes).
            image: vllm/vllm-openai:nightly
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
                  - SYS_ADMIN  # required for `ncu` (Nsight Compute) to access GPU perf counters
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                source /opt/build-scripts/humming-build.sh

                export MAX_TOKENS=$(( ${MAX_TOKENS_PER_NODE:-128} * LWS_GROUP_SIZE ))

                GPU_MEM_UTIL=${DECODE_GPU_MEM_UTIL:-0.88}

                MAX_BATCHED_TOKENS=${MAX_TOKENS}
                MAX_SEQS=${MAX_TOKENS}

                # DeepEP low-latency requires: qp_depth >= (max_dispatch_tokens + 1) * 2
                export NVSHMEM_QP_DEPTH=$(( (MAX_BATCHED_TOKENS + 1) * 2 ))

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                PROFILER_ARGS=""
                if [ "${ENABLE_PROFILING:-0}" = "1" ]; then
                  mkdir -p /var/cache/vllm/profile
                  PROFILER_ARGS="--profiler-config {\"profiler\":\"torch\",\"torch_profiler_dir\":\"/var/cache/vllm/profile\",\"torch_profiler_record_shapes\":true,\"torch_profiler_with_memory\":true,\"max_iterations\":3}"
                fi

                exec vllm serve $PROFILER_ARGS \
                  moonshotai/Kimi-K3 \
                  --port 8200 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --max-model-len ${MAX_MODEL_LEN:-auto} \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-external-lb \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --max-num-batched-tokens ${MAX_BATCHED_TOKENS} \
                  --max-num-seqs ${MAX_SEQS} \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-rank $START_RANK \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail"}' \
                  --all2all-backend deepep_v2 \
                  --language-model-only \
                  --attention-backend FLASHMLA \
                  --moe-backend humming \
                  --disable-custom-all-reduce \
                  --no-enable-flashinfer-autotune \
                  --enable-auto-tool-choice \
                  --tool-call-parser kimi_k3 \
                  --reasoning-parser kimi_k3 \
                  ${KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes=$KV_CACHE_MEMORY_BYTES}
            env:
              - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
                value: "18000000"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: DECODE_GPU_MEM_UTIL
                value: ""
              - name: MAX_MODEL_LEN
                value: "auto"
              - name: ENABLE_PROFILING
                value: "0"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_HUMMING_WIDEN_MOE_WARP_N
                value: "1"
              - name: VLLM_DEEPEP_DISABLE_FUSED_MOE_ALIGN
                value: "1"
              # Required at TP8: the 3-read Mamba conv-state transfer path
              # asserts on this layout (AssertionError otherwise).
              - name: VLLM_SSM_CONV_STATE_LAYOUT
                value: "DS"
              # Enables the Humming MXFP4-weight + block-FP8 (group-128) activation
              # MoE path (vLLM PR 51332) -- see agg-tp8-ep4/serve_correct.yaml.
              - name: VLLM_HUMMING_INPUT_QUANT_CONFIG
                value: '{"dtype":"float8e4m3","group_size":128}'
              - name: VLLM_HUMMING_CAP_MOE_TUNING_K_BLOCK
                value: "1"
              - name: VLLM_COMPUTE_NANS_IN_LOGITS
                value: "1"
              - name: VLLM_MAX_STOP_STRINGS
                value: "4"
              - name: NCCL_DMABUF_ENABLE
                value: "0"
              - name: MAX_TOKENS_PER_NODE
                value: "8"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer

            ports:
              - containerPort: 8200
                name: vllm-rank0
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: vllm-rank0
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: vllm-rank0
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: vllm-rank0
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 32
                ephemeral-storage: 1Ti
                memory: 512Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: build-cache
                mountPath: /shared/vllm-build
              - name: hf-cache
                mountPath: /mnt/hf-cache
              - name: humming-build
                mountPath: /opt/build-scripts
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
