apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - decode.yaml
  - prefill.yaml
  - serviceAccount.yaml
  # Common Humming build step shared by decode.yaml, prefill.yaml, and
  # agg-tp8-ep4/serve.yaml (mounted and `source`d from each role's args,
  # instead of duplicating the script inline). Factored into its own nested
  # kustomization -- see that directory -- so agg-tp8-ep4 can reference the
  # same ConfigMap without pulling in decode.yaml/prefill.yaml too.
  - humming-build
# kv-cache-evictor.yaml moved to components/offloading-tiered: it only
# cleans /mnt/local/kv-cache, used solely by that offloading mode, and its
# pods were polluting the InferencePool's endpoint set (see that dir).
labels:
  - pairs:
      llm-d.ai/model: Kimi-K3
      llm-d.ai/guide: wide-ep-lws
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
    includeSelectors: true
    includeTemplates: true
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: metadata/labels
        create: true
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
        path: spec/leaderWorkerTemplate/workerTemplate/metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: spec/selector/matchLabels
        create: true
