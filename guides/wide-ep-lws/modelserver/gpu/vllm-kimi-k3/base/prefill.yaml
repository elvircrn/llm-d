apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-kimi-k3-prefill
  labels:
    llm-d.ai/model: Kimi-K3
    llm-d.ai/role: prefill
spec:
  replicas: ${PREFILL_REPLICAS}
  leaderWorkerTemplate:
    size: ${PREFILL_SIZE}
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: Kimi-K3
          llm-d.ai/role: prefill
      spec:
        serviceAccountName: kimi-k3
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: prefill
                      llm-d.ai/model: Kimi-K3
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1500Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf-cache
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local/jit-cache
              type: DirectoryOrCreate
          # Shared RWX (shared-vast) build cache -- node-independent, so a pod that
          # reschedules to another node still finds the cached wheel instead of
          # recompiling. Same PVC (and cache keys) as agg-tp8-ep4/serve_correct.yaml
          # and base/decode.yaml, so a wheel built by any of them is reused by all.
          - name: build-cache
            persistentVolumeClaim:
              claimName: kimi-k3-build-cache
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          - name: nvme-cache
            hostPath:
              path: /mnt/local/kv-cache
              type: DirectoryOrCreate
          # Shared vLLM/Humming build script -- see base/humming-build.sh.
          - name: humming-build
            configMap:
              name: humming-build
              defaultMode: 0555
        containers:
          - name: vllm
            # PINNED by digest, NOT :nightly -- see agg-tp8-ep4/serve_correct.yaml
            # for why (shared from-source wheel requires byte-identical torch/ABI
            # across every pod in both the prefill and decode LWSes).
            image: vllm/vllm-openai:nightly
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
                  - SYS_ADMIN  # required for `ncu` (Nsight Compute) to access GPU perf counters
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                source /opt/build-scripts/humming-build.sh

                GPU_MEM_UTIL=${PREFILL_GPU_MEM_UTIL:-0.935}

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                case "${OFFLOADING_MODE:-off}" in
                  cpu)
                    KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail",
                                          "kv_connector_extra_config":{
                                            "connectors":[
                                              {"kv_connector":"NixlConnector","kv_role":"kv_both"},
                                              {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{
                                                 "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                                 "eviction_policy":"lru"
                                            }}]}}'
                    ;;
                  tiered)
                    KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail",
                                          "kv_connector_extra_config":{
                                            "connectors":[
                                              {"kv_connector":"NixlConnector","kv_role":"kv_both"},
                                              {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{
                                                 "spec_name":"TieringOffloadingSpec",
                                                 "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                                 "eviction_policy":"lru",
                                                 "secondary_tiers":[{"type":"fs","root_dir":"/mnt/nvme-cache",
                                                   "n_read_threads":16,"n_write_threads":16}]
                                            }}]}}'
                    ;;
                  *)
                    KV_TRANSFER_CONFIG='{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail"}'
                    ;;
                esac

                exec vllm serve \
                  moonshotai/Kimi-K3 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --max-model-len ${MAX_MODEL_LEN:-auto} \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-external-lb \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --max-num-batched-tokens 2048 \
                  --max-num-seqs 256 \
                  --data-parallel-rank $START_RANK \
                  --kv_transfer_config "$KV_TRANSFER_CONFIG" \
                  --all2all-backend deepep_v2 \
                  --enforce-eager \
                  --language-model-only \
                  --attention-backend FLASHMLA \
                  --moe-backend humming \
                  --disable-custom-all-reduce \
                  --no-enable-flashinfer-autotune \
                  --enable-auto-tool-choice \
                  --tool-call-parser kimi_k3 \
                  --reasoning-parser kimi_k3
            env:
              - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
                value: "18000000"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: PREFILL_GPU_MEM_UTIL
                value: ""
              - name: MAX_MODEL_LEN
                value: "auto"
              - name: KV_OFFLOAD_CPU_BYTES
                value: "107374182400"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "0"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_HUMMING_WIDEN_MOE_WARP_N
                value: "1"
              - name: VLLM_DEEPEP_DISABLE_FUSED_MOE_ALIGN
                value: "1"
              # Required at TP8: the 3-read Mamba conv-state transfer path
              # asserts on this layout (AssertionError otherwise).
              - name: VLLM_SSM_CONV_STATE_LAYOUT
                value: "DS"
              # Enables the Humming MXFP4-weight + block-FP8 (group-128) activation
              # MoE path (vLLM PR 51332) -- see agg-tp8-ep4/serve_correct.yaml.
              - name: VLLM_HUMMING_CAP_MOE_TUNING_K_BLOCK
                value: "1"
              - name: VLLM_COMPUTE_NANS_IN_LOGITS
                value: "0"
              - name: VLLM_MAX_STOP_STRINGS
                value: "4"
              - name: NCCL_DMABUF_ENABLE
                value: "0"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: TP_SIZE
                value: "8"
              - name: VLLM_HUMMING_INPUT_QUANT_CONFIG
                value: '{"dtype":"float8e4m3","group_size":128}'
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer

            ports:
              - containerPort: 8000
                name: dp0
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: dp0
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: dp0
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: dp0
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: build-cache
                mountPath: /shared/vllm-build
              - name: hf-cache
                mountPath: /mnt/hf-cache
              - name: nvme-cache
                mountPath: /mnt/nvme-cache
              - name: humming-build
                mountPath: /opt/build-scripts
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
