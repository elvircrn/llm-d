apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  # Common patches for both decode and prefill LWS
  - target:
      kind: LeaderWorkerSet
    patch: |-
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/volumes/1
        value:
          name: hf-cache
          hostPath:
            path: /mnt/local/hf-cache
            type: DirectoryOrCreate
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/volumes/2
        value:
          name: jit-cache
          hostPath:
            path: /mnt/local/jit-cache
            type: DirectoryOrCreate
      - op: remove
        path: /spec/leaderWorkerTemplate/workerTemplate/metadata/annotations/k8s.v1.cni.cncf.io~1networks
      - op: remove
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/nvidia.com~1roce_gdr
      - op: remove
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/nvidia.com~1roce_gdr
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/limits/rdma~1ib
        value: "8"
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/resources/requests/rdma~1ib
        value: "8"

  # Decode: override IBM HCA values (env indices: NCCL_IB_HCA=12, NVSHMEM_HCA_PREFIX=28)
  - target:
      kind: LeaderWorkerSet
      name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2-decode
    patch: |-
      - op: test
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/12/name
        value: NCCL_IB_HCA
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/12/value
        value: "ibp"
      - op: test
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/28/name
        value: NVSHMEM_HCA_PREFIX
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/28/value
        value: "ibp"

  # Prefill: override IBM HCA values (env indices: NCCL_IB_HCA=13, NVSHMEM_HCA_PREFIX=30)
  - target:
      kind: LeaderWorkerSet
      name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2-prefill
    patch: |-
      - op: test
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/13/name
        value: NCCL_IB_HCA
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/13/value
        value: "ibp"
      - op: test
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/30/name
        value: NVSHMEM_HCA_PREFIX
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/30/value
        value: "ibp"
