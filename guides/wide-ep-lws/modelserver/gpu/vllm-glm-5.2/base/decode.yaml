apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2-decode
  labels:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: decode
spec:
  replicas: ${DECODE_REPLICAS}
  leaderWorkerTemplate:
    size: ${DECODE_SIZE}
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/role: decode
        annotations:
          k8s.v1.cni.cncf.io/networks: multi-nic-h100
      spec:
        serviceAccountName: glm-5-2
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: decode
                      llm-d.ai/model: GLM-5.2-FP8
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        initContainers:
          - name: routing-proxy
            args:
              - --port=8000
              - --vllm-port=8200
              - --data-parallel-size=8
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
              - containerPort: 8001
                name: rank1
                protocol: TCP
              - containerPort: 8002
                name: rank2
                protocol: TCP
              - containerPort: 8003
                name: rank3
                protocol: TCP
              - containerPort: 8004
                name: rank4
                protocol: TCP
              - containerPort: 8005
                name: rank5
                protocol: TCP
              - containerPort: 8006
                name: rank6
                protocol: TCP
              - containerPort: 8007
                name: rank7
                protocol: TCP
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 256Gi
          - name: hf-cache
            persistentVolumeClaim:
              claimName: rits-models-pvc
          - name: jit-cache
            emptyDir:
              sizeLimit: 64Gi
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
        containers:
          - name: vllm
            image: image-registry.openshift-image-registry.svc:5000/tms/tms-vllm-glm52-blog-deepep@sha256:b316246789cdf4bc68f94611598b0940f86f7a836103401b115b45b451fed167
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                # Hotfix: add kv_quant_mode to MLAAttention.get_kv_cache_spec (vllm#48379)
                # PR #47716 fixed deepseek_v4 and sparse_swa but missed mla_attention.py
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/attention/mla_attention.py'
                s=open(p).read()
                if 'get_kv_quant_mode' not in s:
                  s=s.replace('    MLAAttentionSpec,\n)', '    MLAAttentionSpec,\n    get_kv_quant_mode,\n)')
                  s=s.replace('            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n        )',
                              '            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n            kv_quant_mode=get_kv_quant_mode(vllm_config.cache_config.cache_dtype),\n        )')
                  open(p,'w').write(s); print('PATCHED mla_attention.py')
                else: print('mla_attention.py already patched')
                "

                # Hotfix: DeepGemm warmup OOM — remove DP world_size multiplication
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/model_executor/warmup/deep_gemm_warmup.py'
                s=open(p).read()
                old='max_tokens = get_dp_group().world_size * max_tokens'
                if old in s:
                  open(p,'w').write(s.replace(old,'# max_tokens = get_dp_group().world_size * max_tokens')); print('PATCHED deep_gemm_warmup.py')
                else: print('deep_gemm_warmup.py already patched or pattern not found')
                "

                # Hotfix: MLA indexer off-by-one (vllm#43970)
                # expanded_block_table_buffer must match MultiGroupBlockTable padding
                python3 -c "
                import re
                p='/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/indexer.py'
                s=open(p).read()
                if 'block_size <= 128' not in s:
                  pat=r'(max_num_blocks_per_req = cdiv\(\s*\n\s+self\.vllm_config\.model_config\.max_model_len,\s*\n\s+self\.kv_cache_spec\.block_size \* get_total_cp_world_size\(\),\s*\n(\s+)\))'
                  def repl(m):
                    ind=m.group(2)
                    return m.group(1)+'\n'+ind+'block_size = self.kv_cache_spec.block_size\n'+ind+'if block_size <= 128:\n'+ind+'    max_num_blocks_per_req = (\n'+ind+'        cdiv(max_num_blocks_per_req, 128 // block_size)\n'+ind+'        * (128 // block_size)\n'+ind+'    )'
                  new_s=re.sub(pat,repl,s,count=1)
                  if new_s!=s:
                    open(p,'w').write(new_s); print('PATCHED indexer.py')
                  else: print('indexer.py: pattern not found')
                else: print('indexer.py already patched')
                "

                # Hotfix: offloading set_ overflow for packed non-uniform KV caches
                # The indexer group's offset+page_size exceeds block_stride in the packed
                # layout. Replace set_() with as_strided() to avoid bounds check failure.
                python3 -c "
                import re
                p='/usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/worker.py'
                s=open(p).read()
                pat = (r'(tensors_per_block\[layer_name\] = \(\n)'
                       r'(\s+)torch\.tensor\(\n'
                       r'\s+\[\],\n'
                       r'\s+dtype=torch\.int8,\n'
                       r'\s+device=layer_kv_cache\.device,\n'
                       r'\s+\)\.set_\(\n'
                       r'\s+layer_kv_cache\.untyped_storage\(\),\n'
                       r'\s+byte_offset,\n'
                       r'\s+\(num_blocks, page\),\n'
                       r'\s+\(block_stride_bytes, 1\),\n'
                       r'\s+\),\n'
                       r'(\s+)\)')
                repl = (r'\1'
                        r'\2torch.as_strided(\n'
                        r'\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\n'
                        r'\2    (num_blocks, page),\n'
                        r'\2    (block_stride_bytes, 1),\n'
                        r'\2    byte_offset,\n'
                        r'\2),\n'
                        r'\3)')
                new_s, n = re.subn(pat, repl, s)
                if n > 0:
                  open(p,'w').write(new_s); print('PATCHED worker.py')
                else:
                  print('worker.py: no match for set_ pattern')
                "

                # Reserve VRAM for KV metadata and collective staging buffers
                GPU_MEM_UTIL=${DECODE_GPU_MEM_UTIL:-0.95}

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                PROFILER_ARGS=""
                if [ "${ENABLE_PROFILING:-0}" = "1" ]; then
                  mkdir -p /var/cache/vllm/profile
                  PROFILER_ARGS="--profiler-config {\"profiler\":\"torch\",\"torch_profiler_dir\":\"/var/cache/vllm/profile\",\"torch_profiler_record_shapes\":true,\"torch_profiler_with_memory\":true,\"max_iterations\":3}"
                fi

                exec vllm serve zai-org/GLM-5.2-FP8 \
                  $PROFILER_ARGS --kv-cache-dtype fp8 \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                  --served-model-name zai-org/GLM-5.2-FP8 \
                  --port 8200 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --max-model-len 200000 \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port=8208 \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --max-num-batched-tokens 128 \
                  --max-num-seqs 128 \
                  --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}' \
                  --kv-cache-metrics \
                  --kv-cache-metrics-sample 0.01 \
                  --cudagraph-metrics \
                  --enable-mfu-metrics \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --kv_transfer_config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail"}' \
                  --all2all-backend deepep_high_throughput \
                  --moe-backend deep_gemm \
                  --reasoning-parser glm45 \
                  --tool-call-parser glm47 \
                  --enable-auto-tool-choice
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: ENABLE_PROFILING
                value: "0"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_IB_HCA
                value: mlx5_8
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: NVSHMEM_SYMMETRIC_SIZE
                value: 4G
              - name: NVSHMEM_IB_ADDR_RANGE
                value: 0.0.0.0/0
              - name: NVSHMEM_ENABLE_NIC_PE_MAPPING
                value: "0"
              - name: NVSHMEM_IB_GID_INDEX
                value: "3"
              - name: NVSHMEM_HCA_PREFIX
                value: mlx5
              - name: NVSHMEM_DEBUG
                value: INFO
              - name: VLLM_DEEPEP_HIGH_THROUGHPUT_FORCE_INTRA_NODE
                value: "0"
              - name: DECODE_GPU_MEM_UTIL
                value: "0.95"
              - name: OPENBLAS_NUM_THREADS
                value: "1"
              - name: OMP_NUM_THREADS
                value: "1"
              - name: MKL_NUM_THREADS
                value: "1"
              - name: NUMEXPR_NUM_THREADS
                value: "1"
            ports:
              - containerPort: 8200
                name: vllm-rank0
                protocol: TCP
              - containerPort: 8201
                name: vllm-rank1
                protocol: TCP
              - containerPort: 8202
                name: vllm-rank2
                protocol: TCP
              - containerPort: 8203
                name: vllm-rank3
                protocol: TCP
              - containerPort: 8204
                name: vllm-rank4
                protocol: TCP
              - containerPort: 8205
                name: vllm-rank5
                protocol: TCP
              - containerPort: 8206
                name: vllm-rank6
                protocol: TCP
              - containerPort: 8207
                name: vllm-rank7
                protocol: TCP
              - containerPort: 8208
                name: supervisor
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                ephemeral-storage: 128Gi
                memory: 512Gi
                nvidia.com/gpu: "8"
                nvidia.com/roce_gdr: "8"
              requests:
                cpu: 32
                ephemeral-storage: 128Gi
                memory: 512Gi
                nvidia.com/gpu: "8"
                nvidia.com/roce_gdr: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: hf-cache
                mountPath: /mnt/hf-cache
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
