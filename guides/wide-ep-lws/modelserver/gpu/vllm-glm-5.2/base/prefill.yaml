apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2-prefill
  labels:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: prefill
spec:
  replicas: ${PREFILL_REPLICAS}
  leaderWorkerTemplate:
    size: ${PREFILL_SIZE}
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/role: prefill
      spec:
        serviceAccountName: glm-5-2
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      llm-d.ai/role: prefill
                      llm-d.ai/model: GLM-5.2-FP8
                  topologyKey: backend.coreweave.cloud/leafgroup-name
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1500Gi
          - name: hf-cache
            hostPath:
              path: /mnt/local/hf-cache
              type: DirectoryOrCreate
          - name: jit-cache
            hostPath:
              path: /mnt/local/jit-cache
              type: DirectoryOrCreate
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          - name: nvme-cache
            hostPath:
              path: /mnt/local/kv-cache
              type: DirectoryOrCreate
        containers:
          - name: vllm
            image: vllm/vllm-openai:nightly-dd72658e7db0c6a674f473f6f9f0f5c2ebe7e523
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                # Hotfix: disable KV cache zeroing for GLM-5.2 (vllm#49696)
                # KVBlockZeroer asserts uniform page sizes but GLM-5.2 has two
                # KV cache groups (MLA + DSA indexer) with different page sizes.
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/v1/kv_cache_interface.py'
                s=open(p).read()
                old='return self.has_mamba_layers or self.has_mixed_precision_kv_cache'
                new='return self.has_mamba_layers'
                if old in s:
                  open(p,'w').write(s.replace(old,new)); print('PATCHED kv_cache_interface.py: disabled mixed-precision zeroing')
                else: print('kv_cache_interface.py: patch not needed')
                "

                # Debug: log KV cache precision set on startup
                python3 -c "
                import textwrap
                p='/usr/local/lib/python3.12/dist-packages/vllm/v1/kv_cache_interface.py'
                patch=textwrap.dedent('''
                    import logging as _logging
                    _orig_needs_zeroing = KVCacheConfig.needs_kv_cache_zeroing.fget
                    @property
                    def _dbg_needs_zeroing(self):
                        from vllm.v1.kv_cache_interface import AttentionSpec, UniformTypeKVCacheSpecs
                        precs = set()
                        for g in self.kv_cache_groups:
                            gs = g.kv_cache_spec
                            specs = list(gs.kv_cache_specs.values()) if isinstance(gs, UniformTypeKVCacheSpecs) else [gs]
                            for s in specs:
                                if isinstance(s, AttentionSpec):
                                    precs.add((s.dtype, s.kv_quant_mode, type(s).__name__))
                        mixed = len(precs) > 1
                        result = _orig_needs_zeroing(self)
                        _logging.getLogger(\"vllm\").warning(\"KV_CACHE_PRECISIONS: \" + repr(precs) + \"  mixed=\" + repr(mixed) + \"  needs_zeroing=\" + repr(result))
                        return result
                    KVCacheConfig.needs_kv_cache_zeroing = _dbg_needs_zeroing
                ''')
                open(p, 'a').write(patch)
                print('PATCHED kv_cache_interface.py: added precision debug logging')
                "

                #################
                # RUN vLLM GLM-5.2-FP8 prefill worker
                #################

                if [ "${LWS_GROUP_SIZE:-1}" -gt 1 ]; then
                  GPU_MEM_UTIL=0.935
                else
                  GPU_MEM_UTIL=0.935
                fi

                # DSpark speculative decoding (multi-node only — must match decode for NIXL KV layer handshake)
                SPEC_ARGS=""
                KV_CACHE_DTYPE_ARGS="--kv-cache-dtype fp8"
                MAX_BATCHED_ARGS=""
                if [ "${ENABLE_DSPARK:-0}" = "1" ] && [ "${LWS_GROUP_SIZE:-1}" -gt 1 ]; then
                  GPU_MEM_UTIL=$(python3 -c "print(round($GPU_MEM_UTIL - 0.04, 2))")
                  MAX_BATCHED_TOKENS=1024
                  MAX_SEQS=$(( MAX_BATCHED_TOKENS / (DSPARK_NUM_TOKENS + 1) ))
                  export NVSHMEM_QP_DEPTH=$(( (MAX_BATCHED_TOKENS + 1) * 2 ))
                  MAX_BATCHED_ARGS="--max-num-batched-tokens ${MAX_BATCHED_TOKENS} --max-num-seqs ${MAX_SEQS}"
                  SPEC_ARGS="--speculative-config {\"model\":\"${DSPARK_MODEL}\",\"num_speculative_tokens\":${DSPARK_NUM_TOKENS},\"method\":\"dspark\"}"
                  KV_CACHE_DTYPE_ARGS=""
                
                fi

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                KV_TRANSFER_CONFIG='{"kv_connector":"NixlConnector",
                                      "kv_role":"kv_both",
                                      "kv_load_failure_policy":"fail"}'
                if [ "${ENABLE_KV_OFFLOADING:-0}" = "1" ]; then
                  KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                        "kv_role":"kv_both",
                                        "kv_load_failure_policy":"fail",
                                        "kv_connector_extra_config":{
                                            "connectors":[
                                            {"kv_connector":"NixlConnector","kv_role":"kv_both"},
                                            {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                             "kv_connector_extra_config":{
                                               "spec_name":"TieringOffloadingSpec",
                                               "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                               "eviction_policy":"lru"
                                          }}] 
                                          }}'
                fi

                exec vllm serve $SPEC_ARGS $KV_CACHE_DTYPE_ARGS \
                  zai-org/GLM-5.2-FP8 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --max-model-len 962000 \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port=8208 \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address   ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                  --max-num-batched-tokens 2048 \
                  --data-parallel-start-rank $START_RANK \
                  --kv_transfer_config "$KV_TRANSFER_CONFIG" \
                  --moe-backend deep_gemm \
                  --reasoning-parser glm45 \
                  --tool-call-parser glm47 \
                  --enable-auto-tool-choice \
                  --all2all-backend deepep_high_throughput \
                  $MAX_BATCHED_ARGS
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /mnt/hf-cache
              - name: ENABLE_KV_OFFLOADING
                value: "1"
              - name: KV_OFFLOAD_CPU_BYTES
                value: "107374182400"
              - name: ENABLE_DSPARK
                value: "0"
              - name: DSPARK_MODEL
                value: "RedHatAI/GLM-5.2-speculator.dspark"
              - name: DSPARK_NUM_TOKENS
                value: "7"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: PYTHONHASHSEED
                value: "0"
              - name: VLLM_SERVER_DEV_MODE
                value: "1"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP

              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer

            ports:
              - containerPort: 8000
                name: dp0
                protocol: TCP
              - containerPort: 8001
                name: dp1
                protocol: TCP
              - containerPort: 8002
                name: dp2
                protocol: TCP
              - containerPort: 8003
                name: dp3
                protocol: TCP
              - containerPort: 8004
                name: dp4
                protocol: TCP
              - containerPort: 8005
                name: dp5
                protocol: TCP
              - containerPort: 8006
                name: dp6
                protocol: TCP
              - containerPort: 8007
                name: dp7
                protocol: TCP
              - containerPort: 8208
                name: supervisor
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
              requests:
                cpu: 64
                ephemeral-storage: 1Ti
                memory: 1500Gi
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: hf-cache
                mountPath: /mnt/hf-cache
              - name: nvme-cache
                mountPath: /mnt/nvme-cache
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
