apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-nvidia-gpu-vllm-glm-5-2-prefill
  labels:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: prefill
spec:
  replicas: ${PREFILL_REPLICAS}
  leaderWorkerTemplate:
    size: ${PREFILL_SIZE}
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: "wide-ep-lws"
          llm-d.ai/accelerator-variant: "gpu"
          llm-d.ai/accelerator-vendor: "nvidia"
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/role: prefill
        annotations:
          k8s.v1.cni.cncf.io/networks: multi-nic-h100
      spec:
        serviceAccountName: glm-5-2
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H100-80GB-HBM3
        tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
          - effect: NoSchedule
            key: node.kubernetes.io/memory-pressure
            operator: Exists
        initContainers:
          - name: verify-model-mount
            image: busybox:1.36
            imagePullPolicy: IfNotPresent
            command: ["sh", "-c"]
            args:
              - until [ -f /model-cache/models/zai-org/GLM-5.2-FP8/config.json ]; do echo 'config.json not visible; waiting 10s'; sleep 10; done
            volumeMounts:
              - name: hf-cache
                mountPath: /model-cache
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1500Gi
          - name: hf-cache
            persistentVolumeClaim:
              claimName: rits-models-pvc
          - name: jit-cache
            emptyDir:
              sizeLimit: 64Gi
          - name: sys
            hostPath:
              path: /sys
              type: Directory
          - name: proc
            hostPath:
              path: /proc
              type: Directory
          - name: nvme-cache
            hostPath:
              path: /mnt/local/kv-cache
              type: DirectoryOrCreate
          - name: dev-infiniband
            hostPath:
              path: /dev/infiniband
              type: Directory
        containers:
          - name: vllm
            image: image-registry.openshift-image-registry.svc:5000/tms/tms-vllm-glm52-blog-deepep@sha256:b316246789cdf4bc68f94611598b0940f86f7a836103401b115b45b451fed167
            securityContext:
              privileged: true
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                # Hotfix: add kv_quant_mode to MLAAttention.get_kv_cache_spec (vllm#48379)
                # PR #47716 fixed deepseek_v4 and sparse_swa but missed mla_attention.py
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/attention/mla_attention.py'
                s=open(p).read()
                if 'get_kv_quant_mode' not in s:
                  s=s.replace('    MLAAttentionSpec,\n)', '    MLAAttentionSpec,\n    get_kv_quant_mode,\n)')
                  s=s.replace('            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n        )',
                              '            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n            kv_quant_mode=get_kv_quant_mode(vllm_config.cache_config.cache_dtype),\n        )')
                  open(p,'w').write(s); print('PATCHED mla_attention.py')
                else: print('mla_attention.py already patched')
                "

                # Hotfix: DeepGemm warmup OOM — remove DP world_size multiplication
                # deep_gemm_warmup multiplies max_tokens by DP world_size, making the
                # warmup tensor too large. The warmup runs per-rank, so scaling by
                # world_size is wrong — each rank only sees max_num_batched_tokens.
                python3 -c "
                p='/usr/local/lib/python3.12/dist-packages/vllm/model_executor/warmup/deep_gemm_warmup.py'
                s=open(p).read()
                old='max_tokens = get_dp_group().world_size * max_tokens'
                if old in s:
                  open(p,'w').write(s.replace(old,'# max_tokens = get_dp_group().world_size * max_tokens')); print('PATCHED deep_gemm_warmup.py')
                else: print('deep_gemm_warmup.py already patched or pattern not found')
                "

                # Hotfix: MLA indexer off-by-one (vllm#43970)
                # expanded_block_table_buffer must match MultiGroupBlockTable padding
                python3 -c "
                import re
                p='/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/indexer.py'
                s=open(p).read()
                if 'block_size <= 128' not in s:
                  pat=r'(max_num_blocks_per_req = cdiv\(\s*\n\s+self\.vllm_config\.model_config\.max_model_len,\s*\n\s+self\.kv_cache_spec\.block_size \* get_total_cp_world_size\(\),\s*\n(\s+)\))'
                  def repl(m):
                    ind=m.group(2)
                    return m.group(1)+'\n'+ind+'block_size = self.kv_cache_spec.block_size\n'+ind+'if block_size <= 128:\n'+ind+'    max_num_blocks_per_req = (\n'+ind+'        cdiv(max_num_blocks_per_req, 128 // block_size)\n'+ind+'        * (128 // block_size)\n'+ind+'    )'
                  new_s=re.sub(pat,repl,s,count=1)
                  if new_s!=s:
                    open(p,'w').write(new_s); print('PATCHED indexer.py')
                  else: print('indexer.py: pattern not found')
                else: print('indexer.py already patched')
                "

                # Hotfix: offloading set_ overflow for packed non-uniform KV caches
                # The indexer group's offset+page_size exceeds block_stride in the packed
                # layout. Replace set_() with as_strided() to avoid bounds check failure.
                python3 -c "
                import re
                p='/usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/worker.py'
                s=open(p).read()
                pat = (r'(tensors_per_block\[layer_name\] = \(\n)'
                       r'(\s+)torch\.tensor\(\n'
                       r'\s+\[\],\n'
                       r'\s+dtype=torch\.int8,\n'
                       r'\s+device=layer_kv_cache\.device,\n'
                       r'\s+\)\.set_\(\n'
                       r'\s+layer_kv_cache\.untyped_storage\(\),\n'
                       r'\s+byte_offset,\n'
                       r'\s+\(num_blocks, page\),\n'
                       r'\s+\(block_stride_bytes, 1\),\n'
                       r'\s+\),\n'
                       r'(\s+)\)')
                repl = (r'\1'
                        r'\2torch.as_strided(\n'
                        r'\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\n'
                        r'\2    (num_blocks, page),\n'
                        r'\2    (block_stride_bytes, 1),\n'
                        r'\2    byte_offset,\n'
                        r'\2),\n'
                        r'\3)')
                new_s, n = re.subn(pat, repl, s)
                if n > 0:
                  open(p,'w').write(new_s); print('PATCHED worker.py')
                else:
                  print('worker.py: no match for set_ pattern')
                "

                #################
                # RUN vLLM GLM-5.2-FP8 prefill worker
                #################

                GPU_MEM_UTIL=${PREFILL_GPU_MEM_UTIL:-0.9}

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                KV_TRANSFER_CONFIG='{"kv_connector":"NixlConnector",
                                      "kv_role":"kv_both",
                                      "kv_load_failure_policy":"fail"}'
                if [ "${ENABLE_KV_OFFLOADING:-0}" = "1" ]; then
                  KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                        "kv_role":"kv_both",
                                        "kv_load_failure_policy":"fail",
                                        "kv_connector_extra_config":{
                                            "connectors":[
                                            {"kv_connector":"NixlConnector","kv_role":"kv_both"},
                                            {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                             "kv_connector_extra_config":{
                                               "spec_name":"TieringOffloadingSpec",
                                               "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                               "eviction_policy":"lru"
                                          }}]
                                          }}'
                fi

                exec vllm serve /model-cache/models/zai-org/GLM-5.2-FP8 \
                  --kv-cache-dtype fp8 \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                  --served-model-name zai-org/GLM-5.2-FP8 \
                  --port 8000 \
                  --trust-remote-code \
                  --gpu-memory-utilization $GPU_MEM_UTIL \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --max-model-len 200000 \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port=8208 \
                  --enable-expert-parallel \
                  --tensor-parallel-size $TP_SIZE \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --max-num-batched-tokens 2048 \
                  --max-num-seqs 32 \
                  --kv-cache-metrics \
                  --kv-cache-metrics-sample 0.01 \
                  --cudagraph-metrics \
                  --enable-mfu-metrics \
                  --enable-ep-weight-filter \
                  --safetensors-load-strategy lazy \
                  --data-parallel-start-rank $START_RANK \
                  --kv_transfer_config "$KV_TRANSFER_CONFIG" \
                  --moe-backend deep_gemm \
                  --all2all-backend deepep_high_throughput
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: HF_HOME
                value: /model-cache
              - name: TRANSFORMERS_CACHE
                value: /model-cache
              - name: ENABLE_KV_OFFLOADING
                value: "1"
              - name: KV_OFFLOAD_CPU_BYTES
                value: "107374182400"
              - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "8"
              - name: TP_SIZE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_NET
                value: IB
              - name: NCCL_IB_DISABLE
                value: "0"
              - name: NCCL_IB_HCA
                value: mlx5_8
              - name: NCCL_IB_GID_INDEX
                value: "3"
              - name: NCCL_IB_ADDR_FAMILY
                value: AF_INET
              - name: UCX_TLS
                value: rc,cuda_copy,cuda_ipc
              - name: UCX_NET_DEVICES
                value: mlx5_8:1
              - name: UCX_IB_GID_INDEX
                value: "3"
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: PYTHONHASHSEED
                value: "0"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: CCACHE_DIR
                value: /var/cache/vllm/ccache
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: NVSHMEM_SYMMETRIC_SIZE
                value: 4G
              - name: NVSHMEM_IB_ADDR_RANGE
                value: 0.0.0.0/0
              - name: NVSHMEM_ENABLE_NIC_PE_MAPPING
                value: "0"
              - name: NVSHMEM_IB_GID_INDEX
                value: "3"
              - name: NVSHMEM_HCA_PREFIX
                value: mlx5
              - name: NVSHMEM_DEBUG
                value: INFO
              - name: VLLM_DEEPEP_HIGH_THROUGHPUT_FORCE_INTRA_NODE
                value: "0"
              - name: PREFILL_GPU_MEM_UTIL
                value: "0.9"
              - name: CANARY_HOLD_ON_EXIT
                value: "0"
              - name: OPENBLAS_NUM_THREADS
                value: "1"
              - name: OMP_NUM_THREADS
                value: "1"
              - name: MKL_NUM_THREADS
                value: "1"
              - name: NUMEXPR_NUM_THREADS
                value: "1"
            ports:
              - containerPort: 8000
                name: dp0
                protocol: TCP
              - containerPort: 8001
                name: dp1
                protocol: TCP
              - containerPort: 8002
                name: dp2
                protocol: TCP
              - containerPort: 8003
                name: dp3
                protocol: TCP
              - containerPort: 8004
                name: dp4
                protocol: TCP
              - containerPort: 8005
                name: dp5
                protocol: TCP
              - containerPort: 8006
                name: dp6
                protocol: TCP
              - containerPort: 8007
                name: dp7
                protocol: TCP
              - containerPort: 8208
                name: supervisor
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              initialDelaySeconds: 0
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 2700
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              limits:
                cpu: 64
                ephemeral-storage: 128Gi
                memory: 1500Gi
                nvidia.com/gpu: "8"
                nvidia.com/roce_gdr: "8"
              requests:
                cpu: 64
                ephemeral-storage: 128Gi
                memory: 1500Gi
                nvidia.com/gpu: "8"
                nvidia.com/roce_gdr: "8"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: jit-cache
                mountPath: /var/cache/vllm
              - name: hf-cache
                mountPath: /model-cache
              - name: dev-infiniband
                mountPath: /dev/infiniband
              - name: nvme-cache
                mountPath: /mnt/nvme-cache
          - name: node-exporter
            image: quay.io/prometheus/node-exporter:v1.9.0
            imagePullPolicy: IfNotPresent
            args:
              - --collector.disable-defaults
              - --collector.infiniband
              - --collector.netstat
              - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
              - --collector.pressure
              - --collector.schedstat
              - --collector.cpu
              - --path.sysfs=/host/sys
              - --path.procfs=/host/proc
            ports:
              - containerPort: 9100
                name: node-metrics
                protocol: TCP
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
              - name: proc
                mountPath: /host/proc
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
