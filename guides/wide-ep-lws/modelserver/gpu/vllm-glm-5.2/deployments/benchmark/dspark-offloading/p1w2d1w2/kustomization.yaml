apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# GLM-5.2-FP8: DSpark speculative decoding + tiered KV offloading.
# 1 prefill (DEP16, 2 nodes) + 1 decode (DEP16, 2 nodes) -> 4 nodes / 32 GPUs.
resources:
  - ../../../../providers/coreweave
components:
  - ../../../../components/dspark
  - ../../../../components/offloading-tiered
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
