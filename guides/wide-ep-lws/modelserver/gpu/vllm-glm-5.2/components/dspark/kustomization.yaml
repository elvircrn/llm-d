apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: LeaderWorkerSet
    patch: |-
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/5
        value:
          name: ENABLE_MTP
          value: "0"
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/7
        value:
          name: ENABLE_DSPARK
          value: "1"
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/8
        value:
          name: DSPARK_MODEL
          value: "RedHatAI/GLM-5.2-speculator.dspark"
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/11
        value:
          name: VLLM_COMPUTE_NANS_IN_LOGITS
          value: "1"
