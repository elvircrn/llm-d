apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# DeepSeek-V4-Flash-0731: 2 prefill nodes (DEP8 each) + 1 decode node (DEP8) -> 3 nodes / 24 GPUs.
resources:
  - ../../providers/coreweave
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 1
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 1
