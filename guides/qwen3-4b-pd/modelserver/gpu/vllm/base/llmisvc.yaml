# Qwen3-4B-Instruct-2507 as a prefill/decode pair, one GPU per rank, served
# through the RHOAI operator: it builds both workloads, the EPP that picks a
# prefill rank per request, and the route on the shared gateway. `args` on the
# decode container is left empty on purpose — a profiling campaign appends its
# own profiler flags there, and the template's args are passed through to
# `vllm serve`.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-4b
spec:
  baseRefs: []
  labels:
    llm-d.ai/model: Qwen3-4B-Instruct
  model:
    uri: hf://Qwen/Qwen3-4B-Instruct-2507
    name: Qwen/Qwen3-4B-Instruct-2507
  replicas: 1
  parallelism:
    tensor: 1
  router:
    gateway:
      refs:
        - name: openshift-ai-inference
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        args: []
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --gpu-memory-utilization=0.90
              --max-model-len=8192
              --enable-prefix-caching
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
  prefill:
    replicas: 1
    labels:
      llm-d.ai/model: Qwen3-4B-Instruct
    parallelism:
      tensor: 1
    template:
      containers:
        - name: main
          args: []
          env:
            - name: VLLM_ADDITIONAL_ARGS
              value: >-
                --gpu-memory-utilization=0.90
                --max-model-len=8192
                --enable-prefix-caching
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
