# Prefill half of a single-host prefill/decode pair: one vLLM rank that runs the
# prompt pass and publishes its KV cache over NIXL for the decode rank to read.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qwen3-4b-prefill
  labels:
    llm-d.ai/model: Qwen3-4B-Instruct
    llm-d.ai/guide: qwen3-4b-pd
spec:
  replicas: 1
  serviceName: qwen3-4b-prefill
  selector:
    matchLabels:
      app: qwen3-4b-prefill
  template:
    metadata:
      labels:
        app: qwen3-4b-prefill
        llm-d.ai/model: Qwen3-4B-Instruct
        llm-d.ai/guide: qwen3-4b-pd
        llm-d.ai/inference-serving: "true"
        llm-d.ai/role: prefill
    spec:
      initContainers:
        - name: storage-initializer
          image: registry.redhat.io/rhoai/odh-kserve-storage-initializer-rhel9@sha256:65f5cb3580d55024249e5ff3ed653a80008eda8a4ec58bbd52b4865940c35c3d
          args:
            - hf://Qwen/Qwen3-4B-Instruct-2507
            - /mnt/models
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: "1"
              memory: 24Gi
      containers:
        - name: vllm
          image: registry.redhat.io/rhaii-early-access/vllm-cuda-rhel9@sha256:e95153e0bdce2b94d0470d4ac983d3c4b67576280afe99e97ce51700c57f3e5a
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
          args:
            - |-
              exec vllm serve /mnt/models \
                --served-model-name Qwen/Qwen3-4B-Instruct-2507 \
                --port 8000 \
                --tensor-parallel-size 1 \
                --gpu-memory-utilization 0.9 \
                --max-model-len 32768 \
                --enable-prefix-caching \
                --disable-uvicorn-access-log \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
          env:
            - name: HOME
              value: /home
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: nixl
              containerPort: 5600
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: home
              mountPath: /home
      volumes:
        - name: model-storage
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
        - name: home
          emptyDir: {}
