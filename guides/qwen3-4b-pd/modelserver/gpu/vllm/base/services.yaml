# The pair's front door is the decode rank's routing sidecar: it sends the
# prompt pass to the prefill rank over NIXL and generates from the transferred
# cache. The prefill service is headless so the sidecar can reach the rank by
# name.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-4b
  labels:
    llm-d.ai/model: Qwen3-4B-Instruct
    llm-d.ai/guide: qwen3-4b-pd
spec:
  selector:
    app: qwen3-4b-decode
  ports:
    - name: http
      port: 8000
      targetPort: sidecar
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-4b-prefill
  labels:
    llm-d.ai/model: Qwen3-4B-Instruct
    llm-d.ai/guide: qwen3-4b-pd
spec:
  clusterIP: None
  selector:
    app: qwen3-4b-prefill
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: nixl
      port: 5600
      targetPort: nixl
      protocol: TCP
