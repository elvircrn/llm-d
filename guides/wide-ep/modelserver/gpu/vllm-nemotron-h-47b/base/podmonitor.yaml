apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-nemotron-h-47b
spec:
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: Nemotron-H-47B-Reasoning-128K
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 5s
