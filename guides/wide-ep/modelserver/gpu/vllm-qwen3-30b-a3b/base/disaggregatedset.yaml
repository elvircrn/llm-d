apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: wide-ep-vllm-qwen3-30b-a3b
  labels:
    llm-d.ai/model: Qwen3-30B-A3B
    llm-d.ai/guide: wide-ep
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
spec:
  roles:
  - name: prefill
    metadata:
      labels:
        llm-d.ai/model: Qwen3-30B-A3B
        llm-d.ai/guide: wide-ep
        llm-d.ai/accelerator-variant: gpu
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/inference-serving: 'true'
        llm-d.ai/role: prefill
    spec:
      replicas: ${PREFILL_REPLICAS}
      # Tear down the old group before creating the new one on updates. The
      # DisaggregatedSet default (maxSurge=1, maxUnavailable=0) would require a
      # full spare copy of the role to schedule, which deadlocks rollouts on
      # clusters sized for exactly one copy. This matches the LeaderWorkerSet
      # default the guide had before DisaggregatedSet became the base.
      rolloutStrategy:
        type: RollingUpdate
        rollingUpdateConfiguration:
          maxSurge: 0
          maxUnavailable: 1
      leaderWorkerTemplate:
        size: ${PREFILL_SIZE}
        workerTemplate:
          metadata:
            labels:
              llm-d.ai/inference-serving: "true"
              llm-d.ai/guide: "wide-ep"
              llm-d.ai/accelerator-variant: "gpu"
              llm-d.ai/accelerator-vendor: "nvidia"
              llm-d.ai/model: Qwen3-30B-A3B
              llm-d.ai/role: prefill
          spec:
            serviceAccountName: qwen3-30b-a3b
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          llm-d.ai/role: prefill
                          llm-d.ai/model: Qwen3-30B-A3B
                      topologyKey: backend.coreweave.cloud/leafgroup-name
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 256Gi
              - name: hf-cache
                hostPath:
                  path: /mnt/local/hf-cache
                  type: DirectoryOrCreate
              - name: jit-cache
                hostPath:
                  path: /mnt/local/jit-cache
                  type: DirectoryOrCreate
              - name: sys
                hostPath:
                  path: /sys
                  type: Directory
              - name: proc
                hostPath:
                  path: /proc
                  type: Directory
            containers:
              - name: vllm
                image: REPLACE_MODEL_SERVER_IMAGE
                securityContext:
                  capabilities:
                    add:
                      - IPC_LOCK
                      - SYS_RAWIO
                  runAsGroup: 0
                  runAsUser: 0
                imagePullPolicy: Always
                command:
                  - /bin/bash
                  - -c
                args:
                  - |-
                    find /dev/shm -type f -delete

                    #################
                    # RUN vLLM Qwen3-30B-A3B prefill worker
                    #################

                    GPU_MEM_UTIL=${PREFILL_GPU_MEM_UTIL:-0.935}

                    START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                    exec vllm serve Qwen/Qwen3-30B-A3B \
                      --port 8000 \
                      --trust-remote-code \
                      --gpu-memory-utilization $GPU_MEM_UTIL \
                      --max-model-len ${MAX_MODEL_LEN:-auto} \
                      --disable-access-log-for-endpoints=/health,/metrics \
                      --data-parallel-multi-port-external-lb \
                      --data-parallel-supervisor-port=8208 \
                      --enable-expert-parallel \
                      --tensor-parallel-size $TP_SIZE \
                      --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                      --data-parallel-size-local $DP_SIZE_LOCAL \
                      --data-parallel-address ${LWS_LEADER_ADDRESS} \
                      --data-parallel-rpc-port 5555 \
                      --max-num-batched-tokens 2048 \
                      --data-parallel-start-rank $START_RANK \
                      --kv_transfer_config '{"kv_connector":"NixlConnector",
                                            "kv_role":"kv_both",
                                            "kv_load_failure_policy":"fail"}' \
                      --all2all-backend deepep_high_throughput
                env:
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: llm-d-hf-token
                        key: HF_TOKEN
                  - name: HF_HOME
                    value: /mnt/hf-cache
                  - name: PREFILL_GPU_MEM_UTIL
                    value: ""
                  - name: MAX_MODEL_LEN
                    value: "auto"
                  - name: DP_SIZE_LOCAL
                    value: "4"
                  - name: TP_SIZE
                    value: "1"
                  - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                    value: "1"
                  - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                    value: "1"
                  - name: TRITON_LIBCUDA_PATH
                    value: /usr/lib64
                  - name: VLLM_SKIP_P2P_CHECK
                    value: "1"
                  - name: NVIDIA_GDRCOPY
                    value: enabled
                  - name: NVSHMEM_REMOTE_TRANSPORT
                    value: ibgda
                  - name: NVSHMEM_IB_ENABLE_IBGDA
                    value: "true"
                  - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                    value: eth0
                  - name: GLOO_SOCKET_IFNAME
                    value: eth0
                  - name: NCCL_SOCKET_IFNAME
                    value: eth0
                  - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                    value: "120"
                  - name: VLLM_LOGGING_LEVEL
                    value: INFO
                  - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP

                  - name: CUDA_CACHE_PATH
                    value: /var/cache/vllm/cuda
                  - name: CCACHE_DIR
                    value: /var/cache/vllm/ccache
                  - name: VLLM_CACHE_ROOT
                    value: /var/cache/vllm/vllm
                  - name: FLASHINFER_WORKSPACE_BASE
                    value: /var/cache/vllm/flashinfer

                ports:
                  - containerPort: 8000
                    name: dp0
                    protocol: TCP
                  - containerPort: 8001
                    name: dp1
                    protocol: TCP
                  - containerPort: 8002
                    name: dp2
                    protocol: TCP
                  - containerPort: 8003
                    name: dp3
                    protocol: TCP
                  - containerPort: 8208
                    name: supervisor
                    protocol: TCP
                  - containerPort: 5600
                    name: nixl
                    protocol: TCP
                startupProbe:
                  httpGet:
                    path: /health
                    port: supervisor
                  initialDelaySeconds: 0
                  periodSeconds: 1
                  timeoutSeconds: 5
                  failureThreshold: 600
                livenessProbe:
                  httpGet:
                    path: /health
                    port: supervisor
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: supervisor
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                resources:
                  limits:
                    cpu: 32
                    ephemeral-storage: 1Ti
                    memory: 512Gi
                    nvidia.com/gpu: "4"
                  requests:
                    cpu: 32
                    ephemeral-storage: 1Ti
                    memory: 512Gi
                    nvidia.com/gpu: "4"
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
                  - name: jit-cache
                    mountPath: /var/cache/vllm
                  - name: hf-cache
                    mountPath: /mnt/hf-cache
              - name: node-exporter
                image: quay.io/prometheus/node-exporter:v1.9.0
                imagePullPolicy: IfNotPresent
                args:
                  - --collector.disable-defaults
                  - --collector.infiniband
                  - --collector.netstat
                  - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
                  - --collector.pressure
                  - --collector.schedstat
                  - --collector.cpu
                  - --path.sysfs=/host/sys
                  - --path.procfs=/host/proc
                ports:
                  - containerPort: 9100
                    name: node-metrics
                    protocol: TCP
                volumeMounts:
                  - name: sys
                    mountPath: /host/sys
                    readOnly: true
                  - name: proc
                    mountPath: /host/proc
                    readOnly: true
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
  - name: decode
    metadata:
      labels:
        llm-d.ai/model: Qwen3-30B-A3B
        llm-d.ai/guide: wide-ep
        llm-d.ai/accelerator-variant: gpu
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/inference-serving: 'true'
        llm-d.ai/role: decode
    spec:
      replicas: ${DECODE_REPLICAS}
      # See the prefill role above: avoid surge-based rollouts that need a
      # spare copy of the role's GPUs.
      rolloutStrategy:
        type: RollingUpdate
        rollingUpdateConfiguration:
          maxSurge: 0
          maxUnavailable: 1
      leaderWorkerTemplate:
        size: ${DECODE_SIZE}
        workerTemplate:
          metadata:
            labels:
              llm-d.ai/inference-serving: "true"
              llm-d.ai/guide: "wide-ep"
              llm-d.ai/accelerator-variant: "gpu"
              llm-d.ai/accelerator-vendor: "nvidia"
              llm-d.ai/model: Qwen3-30B-A3B
              llm-d.ai/role: decode
          spec:
            serviceAccountName: qwen3-30b-a3b
            affinity:
              podAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          llm-d.ai/role: decode
                          llm-d.ai/model: Qwen3-30B-A3B
                      topologyKey: backend.coreweave.cloud/leafgroup-name
            initContainers:
              - name: routing-proxy
                args:
                  - --port=8000
                  - --vllm-port=8200
                  - --data-parallel-size=4
                  - --kv-connector=nixlv2
                  - --zap-log-level=1
                  - --secure-proxy=false
                  - --enable-prefiller-sampling
                image: REPLACE_ROUTING_SIDECAR_IMAGE
                imagePullPolicy: Always
                ports:
                  - containerPort: 8000
                    name: rank0
                    protocol: TCP
                  - containerPort: 8001
                    name: rank1
                    protocol: TCP
                  - containerPort: 8002
                    name: rank2
                    protocol: TCP
                  - containerPort: 8003
                    name: rank3
                    protocol: TCP
                restartPolicy: Always
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 256Gi
              - name: hf-cache
                hostPath:
                  path: /mnt/local/hf-cache
                  type: DirectoryOrCreate
              - name: jit-cache
                hostPath:
                  path: /mnt/local/jit-cache
                  type: DirectoryOrCreate
              - name: sys
                hostPath:
                  path: /sys
                  type: Directory
              - name: proc
                hostPath:
                  path: /proc
                  type: Directory
            containers:
              - name: vllm
                image: REPLACE_MODEL_SERVER_IMAGE
                securityContext:
                  capabilities:
                    add:
                      - IPC_LOCK
                      - SYS_RAWIO
                  runAsGroup: 0
                  runAsUser: 0
                imagePullPolicy: Always
                command:
                  - /bin/bash
                  - -c
                args:
                  - |-
                    find /dev/shm -type f -delete

                    # Scale MAX_TOKENS with number of decode pods
                    export MAX_TOKENS=$(( ${MAX_TOKENS_PER_NODE:-128} * LWS_GROUP_SIZE ))

                    # Leave headroom for the NVSHMEM symmetric heap (DeepEP low-latency)
                    GPU_MEM_UTIL=${DECODE_GPU_MEM_UTIL:-0.95}

                    # DeepEP low-latency requires: qp_depth >= (max_dispatch_tokens + 1) * 2
                    export NVSHMEM_QP_DEPTH=$(( (MAX_TOKENS + 1) * 2 ))

                    START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                    exec vllm serve Qwen/Qwen3-30B-A3B \
                      --port 8200 \
                      --trust-remote-code \
                      --gpu-memory-utilization $GPU_MEM_UTIL \
                      --max-model-len ${MAX_MODEL_LEN:-auto} \
                      --disable-access-log-for-endpoints=/health,/metrics \
                      --data-parallel-multi-port-external-lb \
                      --data-parallel-supervisor-port=8208 \
                      --enable-expert-parallel \
                      --tensor-parallel-size $TP_SIZE \
                      --max-num-batched-tokens ${MAX_TOKENS} \
                      --max-num-seqs ${MAX_TOKENS} \
                      --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                      --data-parallel-size-local $DP_SIZE_LOCAL \
                      --data-parallel-address ${LWS_LEADER_ADDRESS} \
                      --data-parallel-rpc-port 5555 \
                      --data-parallel-start-rank $START_RANK \
                      --kv_transfer_config '{"kv_connector":"NixlConnector",
                                            "kv_role":"kv_both",
                                            "kv_load_failure_policy":"fail"}' \
                      --all2all-backend deepep_low_latency \
                      --reasoning-parser deepseek_r1 \
                      --tool-call-parser hermes \
                      --enable-auto-tool-choice
                env:
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: llm-d-hf-token
                        key: HF_TOKEN
                  - name: HF_HOME
                    value: /mnt/hf-cache
                  - name: DECODE_GPU_MEM_UTIL
                    value: ""
                  - name: MAX_MODEL_LEN
                    value: "auto"
                  - name: MAX_TOKENS_PER_NODE
                    value: "32"
                  - name: DP_SIZE_LOCAL
                    value: "4"
                  - name: TP_SIZE
                    value: "1"
                  - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
                    value: "1"
                  - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                    value: "1"
                  - name: TRITON_LIBCUDA_PATH
                    value: /usr/lib64
                  - name: VLLM_SKIP_P2P_CHECK
                    value: "1"
                  - name: NVIDIA_GDRCOPY
                    value: enabled
                  - name: NVSHMEM_REMOTE_TRANSPORT
                    value: ibgda
                  - name: NVSHMEM_IB_ENABLE_IBGDA
                    value: "true"
                  - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                    value: eth0
                  - name: GLOO_SOCKET_IFNAME
                    value: eth0
                  - name: NCCL_SOCKET_IFNAME
                    value: eth0
                  - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                    value: "120"
                  - name: VLLM_LOGGING_LEVEL
                    value: INFO
                  - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP

                  - name: CUDA_CACHE_PATH
                    value: /var/cache/vllm/cuda
                  - name: CCACHE_DIR
                    value: /var/cache/vllm/ccache
                  - name: VLLM_CACHE_ROOT
                    value: /var/cache/vllm/vllm
                  - name: FLASHINFER_WORKSPACE_BASE
                    value: /var/cache/vllm/flashinfer

                ports:
                  - containerPort: 8200
                    name: vllm-rank0
                    protocol: TCP
                  - containerPort: 8201
                    name: vllm-rank1
                    protocol: TCP
                  - containerPort: 8202
                    name: vllm-rank2
                    protocol: TCP
                  - containerPort: 8203
                    name: vllm-rank3
                    protocol: TCP
                  - containerPort: 8208
                    name: supervisor
                    protocol: TCP
                  - containerPort: 5600
                    name: nixl
                    protocol: TCP
                startupProbe:
                  httpGet:
                    path: /health
                    port: supervisor
                  initialDelaySeconds: 0
                  periodSeconds: 1
                  timeoutSeconds: 5
                  failureThreshold: 600
                livenessProbe:
                  httpGet:
                    path: /health
                    port: supervisor
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: supervisor
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                resources:
                  limits:
                    ephemeral-storage: 1Ti
                    memory: 512Gi
                    nvidia.com/gpu: "4"
                  requests:
                    cpu: 32
                    ephemeral-storage: 1Ti
                    memory: 512Gi
                    nvidia.com/gpu: "4"
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
                  - name: jit-cache
                    mountPath: /var/cache/vllm
                  - name: hf-cache
                    mountPath: /mnt/hf-cache
              - name: node-exporter
                image: quay.io/prometheus/node-exporter:v1.9.0
                imagePullPolicy: IfNotPresent
                args:
                  - --collector.disable-defaults
                  - --collector.infiniband
                  - --collector.netstat
                  - "--collector.netstat.fields=(.*Retrans.*|.*Timeout.*|.*LossProbe.*|.*FastRetrans.*|.*SackRecovery.*|.*Estab.*|.*Segs.*|.*Drops.*|.*Overflow.*|.*MemoryPressure.*|.*AutoCork.*|.*DSACK.*|.*Reorder.*|.*OFO.*|.*DelayedACK.*)"
                  - --collector.pressure
                  - --collector.schedstat
                  - --collector.cpu
                  - --path.sysfs=/host/sys
                  - --path.procfs=/host/proc
                ports:
                  - containerPort: 9100
                    name: node-metrics
                    protocol: TCP
                volumeMounts:
                  - name: sys
                    mountPath: /host/sys
                    readOnly: true
                  - name: proc
                    mountPath: /host/proc
                    readOnly: true
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
