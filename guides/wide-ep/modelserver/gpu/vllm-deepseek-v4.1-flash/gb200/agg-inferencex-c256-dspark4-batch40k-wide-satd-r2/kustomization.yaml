# Decode-saturation probe of the wide aggregate, pinned to rack 2: rack 1
# is fully held by other tenants, and rack 2 carries the same per-rack
# NVLink fabric, so the two engine pods stay on one fabric. Its router
# values pair this label with a chain that carries no prefix-cache
# affinity filter, so the byte-identical isl-1 probe prompts reach all 8
# rank endpoints.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../agg-inferencex-c256-dspark4-batch40k-wide
nameSuffix: -satd-r2
patches:
  - target:
      kind: LeaderWorkerSet
      name: wide-ep-dsv41-flash-agg
    patch: |-
      - op: replace
        path: /metadata/labels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-satd-r2
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/metadata/labels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-satd-r2
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/serviceAccountName
        value: deepseek-v4.1-flash-satd-r2
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/key
        value: node-role.kubernetes.io/hpc-rack-2
      # The engine's 7200 s ready timeout expires while the worker waits for
      # a second free tray; the leader must survive the campaign's whole
      # 21600 s rollout window or the crash-loop guard aborts the campaign.
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/5/value
        value: '20400'
  - target:
      kind: PodMonitor
      name: wide-ep-dsv41-flash-agg
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-satd-r2
