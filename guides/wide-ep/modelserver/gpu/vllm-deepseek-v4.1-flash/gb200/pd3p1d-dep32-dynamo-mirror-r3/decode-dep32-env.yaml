apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-decode
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            env:
              - name: VLLM_EXTRA_ARGS
                value: '--max-num-seqs 18 --max-num-batched-tokens 180 --no-enable-prefix-caching --additional-config {"dspark_fused_markov":true} --max-num-inflight-kv-loads 18 --max-async-kv-loads-per-step 2 --prefill-schedule-interval 2 --gpu-memory-utilization 0.92 --engram-config {"cpu_offload":false,"embedding_across_dp":true,"use_thp":false} --eplb-config {"communicator":"symm_mem","num_redundant_experts":32,"window_size":1000,"step_interval":3000,"use_async":true,"log_balancedness":false,"log_balancedness_interval":3000} --kv-transfer-config {"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"transfer_mode":"push","backends":["UCX"],"enforce_handshake_compat":false,"kv_lease_duration":120}} --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":108,"cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108]}'
