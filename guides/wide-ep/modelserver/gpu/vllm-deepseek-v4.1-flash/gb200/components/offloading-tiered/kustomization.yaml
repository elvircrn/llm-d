apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Enable tiered (CPU + local NVMe) KV-cache offloading on the prefill role.
patches:
  - patch: |-
      apiVersion: leaderworkerset.x-k8s.io/v1
      kind: LeaderWorkerSet
      metadata:
        name: wide-ep-dsv41-flash-prefill
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 768Gi
                - name: nvme-cache
                  hostPath:
                    path: /mnt/local/kv-cache
                    type: DirectoryOrCreate
              containers:
                - name: vllm
                  env:
                    - name: OFFLOADING_MODE
                      value: "tiered"
                    - name: KV_OFFLOAD_CPU_BYTES
                      value: "68719476736"
                  resources:
                    limits:
                      memory: 896Gi
                    requests:
                      memory: 896Gi
                  volumeMounts:
                    - name: nvme-cache
                      mountPath: /mnt/nvme-cache
