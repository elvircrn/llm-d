apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Enable CPU KV-cache offloading on the prefill role.
patches:
  - patch: |-
      apiVersion: leaderworkerset.x-k8s.io/v1
      kind: LeaderWorkerSet
      metadata:
        name: wide-ep-dsv41-flash-prefill
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 768Gi
              containers:
                - name: vllm
                  env:
                    - name: OFFLOADING_MODE
                      value: "cpu"
                    - name: KV_OFFLOAD_CPU_BYTES
                      value: "137438953472"
                  resources:
                    limits:
                      memory: 896Gi
                    requests:
                      memory: 896Gi
