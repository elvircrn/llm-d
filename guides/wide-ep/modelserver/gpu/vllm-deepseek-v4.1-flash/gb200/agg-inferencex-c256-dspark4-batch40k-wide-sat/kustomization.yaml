# Decode-only saturation probe of the wide aggregate engine: the same LWS
# and serving config as agg-inferencex-c256-dspark4-batch40k-wide, split
# out under the -sat variant label and name suffix so it can run beside
# another campaign in the same namespace without either router
# discovering the other's pods. The patches rewire what the name suffix
# cannot reach inside the LeaderWorkerSet CRD: the pod template's variant
# label and the suffixed service account reference.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../agg-inferencex-c256-dspark4-batch40k-wide
nameSuffix: -sat
patches:
  - target:
      kind: LeaderWorkerSet
      name: wide-ep-dsv41-flash-agg
    patch: |-
      - op: replace
        path: /metadata/labels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-sat
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/metadata/labels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-sat
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/serviceAccountName
        value: deepseek-v4.1-flash-sat
  - target:
      kind: PodMonitor
      name: wide-ep-dsv41-flash-agg
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-sat
