apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../agg-inferencex-c256-dspark4-batch32k
nameSuffix: -b40p
labels:
  - pairs:
      llm-d.ai/variant: dspark4-batch40k-prof
    includeSelectors: true
patches:
  - target:
      kind: StatefulSet
      name: dsv41-inferencex-agg-ds4-b32
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VLLM_EXTRA_ARGS
          value: --max-num-batched-tokens 40960
