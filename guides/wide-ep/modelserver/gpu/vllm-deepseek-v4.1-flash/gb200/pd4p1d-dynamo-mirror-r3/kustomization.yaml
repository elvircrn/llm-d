# Dynamo mirror at 16P+16D (32 GPUs, benchmark 448127): prefill grows to 4
# groups, decode caps from the recipe's 4p1d c4096 override (max-seqs 64,
# batched 640, cudagraph 384).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pd3p1d-dynamo-mirror-r3
patches:
  - path: prefill-replicas-4.yaml
  - path: decode-c4096-env.yaml
