# pd1pd1 with tiered KV offloading: the base one-prefill one-decode shape
# on two 4-GPU trays, decode dp4/ep4. The KV_OFFLOAD_CPU_BYTES patch
# restores the pre-01fa89ed 64GiB-per-rank tier; the NUMA pinning that the
# shrink dodged is gone since 8620ce9f.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - render.yaml
components:
  - ../components/offloading-tiered
patches:
  - patch: |-
      apiVersion: leaderworkerset.x-k8s.io/v1
      kind: LeaderWorkerSet
      metadata:
        name: wide-ep-dsv41-flash-prefill
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: vllm
                  env:
                    - name: VLLM_EXTRA_ARGS
                      value: --max-num-batched-tokens 16384 --enable-ep-weight-filter
                    - name: KV_OFFLOAD_CPU_BYTES
                      value: "68719476736"
  - patch: |-
      apiVersion: leaderworkerset.x-k8s.io/v1
      kind: LeaderWorkerSet
      metadata:
        name: wide-ep-dsv41-flash-decode
      spec:
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: vllm
                  env:
                    - name: VLLM_EXTRA_ARGS
                      value: --disable-prefix-caching
