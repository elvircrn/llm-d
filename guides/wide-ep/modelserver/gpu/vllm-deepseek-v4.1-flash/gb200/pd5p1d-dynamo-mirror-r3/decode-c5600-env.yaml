apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-decode
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            env:
              - name: VLLM_EXTRA_ARGS
                value: '--max-num-seqs 112 --max-num-batched-tokens 1120 --no-enable-prefix-caching --additional-config {"dspark_fused_markov":true} --max-num-inflight-kv-loads 112 --max-async-kv-loads-per-step 7 --prefill-schedule-interval 2 --gpu-memory-utilization 0.92 --engram-config {"cpu_offload":false,"embedding_across_dp":true,"use_thp":false} --eplb-config {"communicator":"symm_mem","num_redundant_experts":16,"window_size":1000,"step_interval":3000,"use_async":true,"log_balancedness":false,"log_balancedness_interval":3000} --kv-transfer-config {"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"transfer_mode":"push","backends":["UCX"],"enforce_handshake_compat":false,"kv_lease_duration":120}} --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":672,"cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192,198,204,210,216,222,228,234,240,246,252,258,264,270,276,282,288,294,300,306,312,318,324,330,336,342,348,354,360,366,372,378,384,390,396,402,408,414,420,426,432,438,444,450,456,462,468,474,480,486,492,498,504,510,516,522,528,534,540,546,552,558,564,570,576,582,588,594,600,606,612,618,624,630,636,642,648,654,660,666,672]}'
