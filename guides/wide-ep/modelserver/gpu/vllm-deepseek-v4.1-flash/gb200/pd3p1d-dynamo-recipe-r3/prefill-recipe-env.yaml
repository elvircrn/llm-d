apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-prefill
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            env:
              # Same role as in the fixed overlay: keep the base's
              # kv-events-config append off; the corrected endpoint rides in
              # VLLM_EXTRA_ARGS.
              - name: OFFLOADING_MODE
                value: "forwarded"
              - name: NCCL_CUMEM_ENABLE
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_RUST_FRONTEND
                value: "true"
              # Block-hash seed shared with the EPP's token processor
              # (tokenProcessorConfig.hashSeed) so the precise prefix index
              # matches request keys against engine-published block hashes.
              - name: PYTHONHASHSEED
                value: "0"
              - name: VLLM_EXTRA_ARGS
                value: "--max-num-seqs 64 --max-num-batched-tokens 32768 --prefill-schedule-interval 2 --prefix-cache-retention-interval 32768 --gpu-memory-utilization 0.90 --engram-config {\"cpu_offload\":true,\"embedding_across_dp\":true,\"use_thp\":false} --kv-transfer-config {\"kv_connector\":\"MultiConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"connectors\":[{\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_both\",\"kv_load_failure_policy\":\"fail\",\"kv_buffer_device\":\"cuda\",\"kv_connector_extra_config\":{\"transfer_mode\":\"push\",\"backends\":[\"UCX\"],\"enforce_handshake_compat\":false,\"kv_lease_duration\":120}},{\"kv_connector\":\"SimpleCPUOffloadConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"cpu_bytes_to_use\":75161927680,\"lazy_offload\":true}}]}} --kv-events-config {\"enable_kv_cache_events\":true,\"publisher\":\"zmq\",\"endpoint\":\"tcp://*:5556\",\"topic\":\"kv@$(POD_IP):5556@deepseek-ai/DeepSeek-V4.1-Flash\"} --compilation-config {\"mode\":\"VLLM_COMPILE\",\"cudagraph_mode\":\"FULL_AND_PIECEWISE\",\"cudagraph_capture_sizes\":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046],\"decoder_replay_cudagraph_capture_sizes\":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,2048],\"max_cudagraph_capture_size\":2046}"
