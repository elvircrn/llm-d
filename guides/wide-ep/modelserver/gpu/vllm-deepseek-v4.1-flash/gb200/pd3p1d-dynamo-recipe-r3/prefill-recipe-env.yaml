apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-prefill
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            env:
              # The p2p mode needs a vLLM build carrying the notif guard
              # (elvircrn/vllm p2p-notif-guard): the second in-process NIXL
              # agent can deliver a garbled notification into the
              # NixlConnector pull worker, whose unguarded UTF-8 decode
              # killed the engine 60s into first traffic. The campaign JSON
              # supplies that build; without it this mode is unrunnable.
              - name: OFFLOADING_MODE
                value: "p2p"
              - name: NCCL_CUMEM_ENABLE
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_RUST_FRONTEND
                value: "1"
              - name: HF_HUB_OFFLINE
                value: "1"
              # Block-hash seed shared with the EPP's token processor
              # (tokenProcessorConfig.hashSeed) so the precise prefix index
              # matches request keys against engine-published block hashes.
              - name: PYTHONHASHSEED
                value: "0"
              - name: KV_OFFLOAD_CPU_BYTES
                value: "80530636800"
              # Contiguous GPU KV block runs: the CPU-tier loads and P/D
              # pushes move as few large transfers instead of thousands of
              # scattered 64-token block copies. Needs the contig-alloc-port
              # vLLM build in the campaign JSON.
              - name: VLLM_KV_CONTIG_ALLOC
                value: "1"
              - name: VLLM_EXTRA_ARGS
                value: "--max-num-seqs 64 --max-num-batched-tokens 32768 --prefill-schedule-interval 2 --prefix-cache-retention-interval 32768 --gpu-memory-utilization 0.90 --engram-config {\"cpu_offload\":true,\"embedding_across_dp\":true,\"use_thp\":false}  --kv-events-config {\"enable_kv_cache_events\":true,\"publisher\":\"zmq\",\"endpoint\":\"tcp://*:5556\",\"topic\":\"kv@$(POD_IP):5556@deepseek-ai/DeepSeek-V4.1-Flash\"} --compilation-config {\"mode\":\"VLLM_COMPILE\",\"cudagraph_mode\":\"FULL_AND_PIECEWISE\",\"cudagraph_capture_sizes\":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046],\"decoder_replay_cudagraph_capture_sizes\":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,2048],\"max_cudagraph_capture_size\":2046}"
