apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-prefill
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            resources:
              requests:
                cpu: "64"
                ephemeral-storage: 256Gi
                memory: 448Gi
                nvidia.com/gpu: "4"
              limits:
                cpu: "64"
                ephemeral-storage: 256Gi
                memory: 448Gi
                nvidia.com/gpu: "4"
---
