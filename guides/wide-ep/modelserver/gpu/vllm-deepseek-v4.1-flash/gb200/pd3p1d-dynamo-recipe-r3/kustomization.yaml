# Dynamo 448125 recipe alignment on the fabric-KV chain: prefill carries
# NixlConnector kv_both plus SimpleCPUOffloadConnector with lazy offload
# (the submission's "vllm-simple" offload), utilization-bounded KV at 0.90,
# NCCL cuMem allocations. Decode was already recipe-aligned by the mirror
# overlay; this only adds the two env flags it lacked. Session-affinity
# routing and NUMA binding stay out: the first is dynamo's router, the
# second OOM-killed node daemons on these GB200s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pd3p1d-dynamo-mirror-r3-cpuoffload-fixed
patches:
  - path: prefill-recipe-env.yaml
  - path: decode-recipe-env.yaml
