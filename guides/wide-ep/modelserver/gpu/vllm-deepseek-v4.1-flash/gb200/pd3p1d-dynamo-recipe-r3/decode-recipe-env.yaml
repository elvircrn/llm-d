apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-decode
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            env:
              - name: NCCL_CUMEM_ENABLE
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_RUST_FRONTEND
                value: "1"
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: PYTHONHASHSEED
                value: "0"
              # Dynamo 448125 allocates 300GB of DRAM on the decode worker
              # too (decode_allocated_cpu_dram_gb); without a CPU tier our
              # decode holds nothing between turns, so every continuation
              # recomputes or refetches from prefill.
              - name: OFFLOADING_MODE
                value: "p2p"
              - name: KV_OFFLOAD_CPU_BYTES
                value: "80530636800"
              - name: VLLM_EXTRA_ARGS
                value: '--max-num-seqs 48 --max-num-batched-tokens 480 --no-enable-prefix-caching --additional-config {"dspark_fused_markov":true} --max-num-inflight-kv-loads 48 --max-async-kv-loads-per-step 3 --prefill-schedule-interval 2 --gpu-memory-utilization 0.92 --engram-config {"cpu_offload":false,"embedding_across_dp":true,"use_thp":false} --eplb-config {"communicator":"symm_mem","num_redundant_experts":16,"window_size":1000,"step_interval":3000,"use_async":true,"log_balancedness":false,"log_balancedness_interval":3000} --compilation-config {"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":288,"cudagraph_capture_sizes":[6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192,198,204,210,216,222,228,234,240,246,252,258,264,270,276,282,288]}'
