# pd1p4d descale of the pd3p1d rack-3 variant: one prefill group instead of
# three, decode engine unchanged (dp16/ep16 across four pods on four trays).
# Used when only five 4-GPU trays are schedulable on rack 3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pd3p1d-offload-tiered-r3
patches:
  - path: prefill-replicas-1.yaml
  - path: nccl-fabric-off.yaml
    target:
      group: leaderworkerset.x-k8s.io
      version: v1
      kind: LeaderWorkerSet
      name: wide-ep-dsv41-flash-decode
