# Cross-node NCCL NVLS/MNNVL init spins in the kernel when the rack's
# fabric multicast state is wedged; decode moves no cross-node data
# through NCCL (TP1, gloo DP sync, mega_moe a2a), so both stay off.
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
  value:
    name: NCCL_NVLS_ENABLE
    value: "0"
- op: add
  path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
  value:
    name: NCCL_MNNVL_ENABLE
    value: "0"
