# pd2pd8: the pd1pd8 shape with two prefill groups. Each group is one pod
# on its own 4-GPU tray running an independent TP1 x DP4 + EP4 engine, so
# the router balances prefill across two engines while decode stays one
# dp32/ep32 engine across eight pods.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pd1pd8
patches:
  - path: prefill-replicas.yaml
