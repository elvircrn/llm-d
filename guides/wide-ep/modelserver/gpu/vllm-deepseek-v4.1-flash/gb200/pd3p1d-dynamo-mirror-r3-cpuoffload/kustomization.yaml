# Dynamo mirror with the NVMe spill removed: CPU-only offload at dynamo's
# own 70GiB (75161927680) instead of our 64GiB CPU + NVMe tier. Tests
# whether disk-tier reads were the TTFT killer; everything else identical
# to pd3p1d-dynamo-mirror-r3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pd3p1d-dynamo-mirror-r3
patches:
  - path: prefill-cpuoffload-env.yaml
