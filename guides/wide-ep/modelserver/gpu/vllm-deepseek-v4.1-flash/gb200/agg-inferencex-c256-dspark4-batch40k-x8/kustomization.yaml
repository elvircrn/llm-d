apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../agg-inferencex-c256-dspark4-batch40k
nameSuffix: -x8
labels:
  - pairs:
      llm-d.ai/variant: dspark4-batch40k-x8
    includeSelectors: true
patches:
  - target:
      kind: StatefulSet
      name: dsv41-inferencex-agg-ds4-b32-b40
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 8
