# Decode-saturation probe of the wide aggregate: the same LWS and serving
# config under the -satd-r1 variant label, inheriting rack-1 affinity from
# the base overlay; its router values pair this label with a
# weighted-random picker so isl-1 traffic reaches all 8 rank endpoints.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../agg-inferencex-c256-dspark4-batch40k-wide
nameSuffix: -satd-r1
patches:
  - target:
      kind: LeaderWorkerSet
      name: wide-ep-dsv41-flash-agg
    patch: |-
      - op: replace
        path: /metadata/labels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-satd-r1
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/metadata/labels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-satd-r1
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/serviceAccountName
        value: deepseek-v4.1-flash-satd-r1
      # The engine's 7200 s ready timeout expires while the worker waits for
      # a second free tray; the leader must survive the campaign's whole
      # 21600 s rollout window or the crash-loop guard aborts the campaign.
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/5/value
        value: '20400'
  - target:
      kind: PodMonitor
      name: wide-ep-dsv41-flash-agg
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/llm-d.ai~1variant
        value: dspark4-batch40k-wide-satd-r1
