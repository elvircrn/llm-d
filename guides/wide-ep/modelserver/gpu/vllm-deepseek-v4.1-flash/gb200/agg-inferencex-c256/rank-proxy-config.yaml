apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv41-inferencex-agg-rank-proxy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: rank0
          address:
            socket_address: {address: 0.0.0.0, port_value: 8000}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: rank0
                    route_config:
                      name: rank0
                      virtual_hosts:
                        - name: rank0
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route:
                                cluster: vllm
                                timeout: 86400s
                                idle_timeout: 86400s
                                request_headers_to_add:
                                  - header: {key: x-data-parallel-rank, value: "0"}
                                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: rank1
          address:
            socket_address: {address: 0.0.0.0, port_value: 8001}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: rank1
                    route_config:
                      name: rank1
                      virtual_hosts:
                        - name: rank1
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route:
                                cluster: vllm
                                timeout: 86400s
                                idle_timeout: 86400s
                                request_headers_to_add:
                                  - header: {key: x-data-parallel-rank, value: "1"}
                                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: rank2
          address:
            socket_address: {address: 0.0.0.0, port_value: 8002}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: rank2
                    route_config:
                      name: rank2
                      virtual_hosts:
                        - name: rank2
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route:
                                cluster: vllm
                                timeout: 86400s
                                idle_timeout: 86400s
                                request_headers_to_add:
                                  - header: {key: x-data-parallel-rank, value: "2"}
                                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: rank3
          address:
            socket_address: {address: 0.0.0.0, port_value: 8003}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: rank3
                    route_config:
                      name: rank3
                      virtual_hosts:
                        - name: rank3
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route:
                                cluster: vllm
                                timeout: 86400s
                                idle_timeout: 86400s
                                request_headers_to_add:
                                  - header: {key: x-data-parallel-rank, value: "3"}
                                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: vllm
          type: STATIC
          connect_timeout: 10s
          load_assignment:
            cluster_name: vllm
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: 127.0.0.1, port_value: 8100}
