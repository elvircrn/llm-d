# Node-budget mirror on rack 2: same config as
# pd3p1d-dynamo-mirror-r3-cpuoffload-big2 with the fabric affinity
# pointed at hpc-rack-2, whose NVL72 domain is a separate fabric.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pd3p1d-dynamo-mirror-r3-cpuoffload-big2
patches:
  - target:
      group: leaderworkerset.x-k8s.io
      version: v1
      kind: LeaderWorkerSet
      name: wide-ep-dsv41-flash-prefill
    patch: |-
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/key
        value: node-role.kubernetes.io/hpc-rack-2
  - target:
      group: leaderworkerset.x-k8s.io
      version: v1
      kind: LeaderWorkerSet
      name: wide-ep-dsv41-flash-decode
    patch: |-
      - op: replace
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/key
        value: node-role.kubernetes.io/hpc-rack-2
