# Prefill role of the DeepSeek-V4.1-Flash disaggregated P/D serving shape
# for GB200 NVL72 trays: one pod per 4-GPU tray running TP1 x DP4 + EP4
# behind rank-addressable external load balancing, DSpark speculative decoding, and the
# engram tables CPU-offloaded with embeddings sharded across DP ranks. The MoE
# all-to-all stays inside the pod's NVLink domain; prefill-to-decode KV
# crosses pods through NixlConnector.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-prefill
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: DeepSeek-V4.1-Flash
    llm-d.ai/role: prefill
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 1
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: DeepSeek-V4.1-Flash
          llm-d.ai/role: prefill
      spec:
        serviceAccountName: deepseek-v4.1-flash
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: llm-d-dev-claim
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              # The engram tables are DP-sharded into private host
              # memory; /dev/shm only serves NCCL and IPC now.
              sizeLimit: 256Gi
          - name: lustre
            persistentVolumeClaim:
              claimName: lustre-pvc-vllm
        containers:
          - name: vllm
            image: docker.io/vllm/vllm-openai:nightly
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
                  - SYS_RAWIO
              runAsGroup: 0
              runAsUser: 0
            imagePullPolicy: Always
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                if [ -f /opt/vllm/bin/activate ]; then source /opt/vllm/bin/activate; fi

                # First boot JIT-compiles Triton, DeepGEMM, FlashInfer,
                # TileLang and inductor kernels; the caches persist on the
                # lustre volume, per-pod prefixed so concurrent pods never
                # share a dir. TileLang commits each kernel through a
                # per-process staging dir and an atomic rename, so the pod's
                # DP ranks can share one cache dir.
                export TRITON_CACHE_DIR="/mnt/lustre/jit/$HOSTNAME/triton"
                export DG_JIT_CACHE_DIR="/mnt/lustre/jit/$HOSTNAME/deep_gemm"
                export FLASHINFER_CACHE_DIR="/mnt/lustre/jit/$HOSTNAME/flashinfer"
                export TILELANG_CACHE_DIR="/mnt/lustre/jit/$HOSTNAME/tilelang"
                export TORCHINDUCTOR_CACHE_DIR="/mnt/lustre/jit/$HOSTNAME/inductor"
                export VLLM_CACHE_ROOT="/mnt/lustre/jit/$HOSTNAME/vllm"

                #################
                # RUN vLLM DeepSeek-V4.1-Flash prefill worker
                #################

                case "${OFFLOADING_MODE:-off}" in
                  cpu)
                    KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail",
                                          "kv_connector_extra_config":{
                                            "connectors":[
                                              {"kv_connector":"NixlConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{"kv_lease_duration":600}},
                                              {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{
                                                 "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                                 "eviction_policy":"lru"
                                            }}]}}'
                    ;;
                  tiered)
                    KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail",
                                          "kv_connector_extra_config":{
                                            "connectors":[
                                              {"kv_connector":"NixlConnector","kv_role":"kv_producer",
                                               "kv_connector_extra_config":{"kv_lease_duration":600}},
                                              {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{
                                                 "spec_name":"TieringOffloadingSpec",
                                                 "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                                 "eviction_policy":"lru",
                                                 "secondary_tiers":[{"type":"fs","root_dir":"/mnt/nvme-cache",
                                                   "n_read_threads":16,"n_write_threads":16}]
                                            }}]}}'
                    ;;
                  p2p)
                    KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                          "kv_role":"kv_both",
                                          "kv_load_failure_policy":"fail",
                                          "kv_connector_extra_config":{
                                            "connectors":[
                                              {"kv_connector":"NixlConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{"kv_lease_duration":600}},
                                              {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                               "kv_connector_extra_config":{
                                                 "spec_name":"TieringOffloadingSpec",
                                                 "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                                 "eviction_policy":"lru",
                                                 "offload_prompt_only":false,
                                                 "self_describing_kv_events":true,
                                                 "secondary_tiers":[{"type":"p2p","host":"'"${POD_IP}"'",
                                                   "port":'"$((7777 - START_RANK))"'}]
                                            }}]}}'
                    ;;
                  *)
                    KV_TRANSFER_CONFIG='{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_connector_extra_config":{"kv_lease_duration":600}}'
                    ;;
                esac

                set -- deepseek-ai/DeepSeek-V4.1-Flash \
                  --revision 5254448103b6254fc646dacbca1cbbf20e9216c1 \
                  --tokenizer-revision 5254448103b6254fc646dacbca1cbbf20e9216c1 \
                  --served-model-name deepseek-ai/DeepSeek-V4.1-Flash \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --tensor-parallel-size 1 \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port 8004 \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local $DP_SIZE_LOCAL \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank $START_RANK \
                  --enable-expert-parallel \
                  --disable-ep-weight-filter \
                  --kernel-config '{"moe_backend":"deep_gemm_mega_moe","enable_flashinfer_autotune":true}' \
                  --attention-config '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}' \
                  --tokenizer-mode deepseek_v41 \
                  --renderer-num-workers 4 \
                  --reasoning-parser deepseek_v41 \
                  --tool-call-parser deepseek_v41 \
                  --enable-auto-tool-choice \
                  --language-model-only \
                  --max-model-len 1048576 \
                  --max-num-batched-tokens 8192 \
                  --gpu-memory-utilization 0.90 \
                  --enable-cumem-allocator \
                  --enable-prefix-caching \
                  --enable-chunked-prefill \
                  --enable-prompt-tokens-details \
                  --safetensors-load-strategy prefetch \
                  --speculative-config "{\"method\":\"dspark\",\"num_speculative_tokens\":$DSPEC_NUM_TOKENS,\"draft_sample_method\":\"probabilistic\",\"rejection_sample_method\":\"block\",\"enable_adaptive_verification\":false}" \
                  --compilation-config '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,10,15,20,25,30,40,50,60,80,100,120,160,200,240,320,400,480,640,850,1280,1705,2045],"max_cudagraph_capture_size":2045}' \
                  --engram-config '{"cpu_offload":true,"embedding_across_dp":false,"dp_shared_memory":true}' \
                  --kv-cache-dtype fp8 \
                  --kv-transfer-config "$KV_TRANSFER_CONFIG" \
                  --disable-uvicorn-access-log \
                  --disable-access-log-for-endpoints /health,/metrics,/v1/models \
                  ${VLLM_EXTRA_ARGS:-}

                case "${OFFLOADING_MODE:-off}" in
                  p2p)
                    set -- "$@" --enable-scale-out
                    ;;
                esac

                case "${OFFLOADING_MODE:-off}" in
                  cpu|tiered|p2p)
                    # The precise prefix index subscribes on one port per rank.
                    set -- "$@" \
                      --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq",
                                           "endpoint":"tcp://*:'"$((5556 - START_RANK))"'",
                                           "topic":"kv@'"${POD_IP}"':8000@deepseek-ai/DeepSeek-V4.1-Flash"}'
                    ;;
                esac

                # Strict prefix-cache affinity requires THP off for the
                # whole vLLM process tree; PR_SET_THP_DISABLE survives
                # exec and fork, so every engine and worker inherits it.
                exec python3 -c "import ctypes, os, sys; r = ctypes.CDLL(None, use_errno=True).prctl(41, 1, 0, 0, 0); print(\"THP disabled\" if r == 0 else \"WARNING: PR_SET_THP_DISABLE failed errno=%d\" % ctypes.get_errno(), file=sys.stderr, flush=True); os.execvp(\"vllm\", [\"vllm\", \"serve\"] + sys.argv[1:])" "$@"
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: HF_TOKEN
              # The ~509 GB checkpoint cannot download into the pod's
              # ephemeral storage; weights load from the lustre mount.
              - name: HF_HUB_CACHE
                value: /mnt/lustre
              - name: HF_HUB_DISABLE_XET
                value: "1"
              - name: DP_SIZE_LOCAL
                value: "4"
              - name: DSPEC_NUM_TOKENS
                value: "5"
              # Enables POST /reset_prefix_cache, which the benchmark
              # harness calls on every engine between concurrency levels.
              - name: VLLM_SERVER_DEV_MODE
                value: "1"
              - name: VLLM_NO_USAGE_STATS
                value: "1"
              - name: VLLM_ENGINE_READY_TIMEOUT_S
                value: "3600"
              - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
                value: "1800"
              - name: TQDM_DISABLE
                value: "1"
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_SKIP_P2P_CHECK
                value: "1"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: VLLM_USE_DEEP_GEMM
                value: "1"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: NVIDIA_GDRCOPY
                value: enabled
              # Pods on this cluster get no /dev/infiniband; once CUDA is up,
              # UCX's default rc_verbs probe kills ucp worker creation and
              # NIXL dies with NIXL_ERR_BACKEND. KV moves over the NVLink
              # fabric (cuda_ipc) with TCP as the fallback transport.
              - name: UCX_TLS
                value: cuda_copy,cuda_ipc,tcp
              - name: UCX_CUDA_IPC_ENABLE_MNNVL
                value: "1"
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_IB_HCA
                value: ibp
              # Keeps numpy from re-enabling huge pages the THP wrapper
              # turned off.
              - name: NUMPY_MADVISE_HUGEPAGE
                value: "0"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              # The decode pod's disagg sidecar pools idle conns for 90s; a
              # shorter server keep-alive makes reused conns get RST mid-request
              # and surface to clients as 502.
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "300"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            ports:
              - containerPort: 8000
                name: rank0
                protocol: TCP
              - containerPort: 8001
                name: rank1
                protocol: TCP
              - containerPort: 8002
                name: rank2
                protocol: TCP
              - containerPort: 8003
                name: rank3
                protocol: TCP
              - containerPort: 8004
                name: supervisor
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 1
              timeoutSeconds: 5
              failureThreshold: 3600
            livenessProbe:
              httpGet:
                path: /health
                port: supervisor
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /readyz
                port: supervisor
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              claims:
                - name: compute-domain-channel
              limits:
                cpu: 32
                ephemeral-storage: 256Gi
                memory: 512Gi
                nvidia.com/gpu: "4"
              requests:
                cpu: 32
                ephemeral-storage: 256Gi
                memory: 512Gi
                nvidia.com/gpu: "4"
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - mountPath: /mnt/lustre
                name: lustre
