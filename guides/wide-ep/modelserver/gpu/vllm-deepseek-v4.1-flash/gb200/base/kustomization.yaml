apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - decode.yaml
  - prefill.yaml
  - serviceAccount.yaml

# The schema teaches kustomize the LeaderWorkerSet merge keys, so strategic
# merge patches anywhere in a build composing this base match containers,
# volumes, env entries, and volume mounts by name instead of array index.
openapi:
  path: leaderworkerset-schema.json
