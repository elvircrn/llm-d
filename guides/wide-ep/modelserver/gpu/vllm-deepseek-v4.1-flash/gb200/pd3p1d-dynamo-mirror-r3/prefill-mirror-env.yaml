apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-dsv41-flash-prefill
spec:
  leaderWorkerTemplate:
    workerTemplate:
      spec:
        containers:
          - name: vllm
            env:
              - name: VLLM_EXTRA_ARGS
                value: '--max-num-seqs 64 --max-num-batched-tokens 32768 --prefill-schedule-interval 2 --prefix-cache-retention-interval 32768 --engram-config {"cpu_offload":true,"embedding_across_dp":true,"use_thp":false} --kv-transfer-config {"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"transfer_mode":"push","backends":["UCX"],"enforce_handshake_compat":false,"kv_lease_duration":120}},{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":75161927680,"lazy_offload":true}}]}} --compilation-config {"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046],"decoder_replay_cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,2048],"max_cudagraph_capture_size":2046}'
              - name: DSPEC_NUM_TOKENS
                value: "5"
              - name: VLLM_ALLREDUCE_USE_SYMM_MEM
                value: "0"
              - name: PYTORCH_CUDA_ALLOC_CONF
                value: expandable_segments:True
              - name: VLLM_LOG_STATS_INTERVAL
                value: "1"
              - name: UCX_MEMTYPE_CACHE
                value: "n"
              - name: UCX_MEMTYPE_REG_WHOLE
                value: "n"
              - name: UCX_RNDV_PIPELINE_ERROR_HANDLING
                value: "y"
              - name: NIXL_UCX_SGL_ENABLE
                value: "1"
              - name: UCX_MODULE_DIR
                value: /usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx
