apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: wide-ep-dsv41-flash-agg
spec:
  selector:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: DeepSeek-V4.1-Flash
      llm-d.ai/variant: dspark4-batch40k-wide
  podMetricsEndpoints:
    - port: rank0
      path: /metrics
      interval: 5s
    - port: rank1
      path: /metrics
      interval: 5s
    - port: rank2
      path: /metrics
      interval: 5s
    - port: rank3
      path: /metrics
      interval: 5s
