apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# agg2r-tp4dp2-spec3-r2: the base shape scaled to two replica groups,
# i.e. 2 pods across 2 nodes (16 GPUs aggregate).
resources:
  - ../../base
patches:
  - target:
      kind: LeaderWorkerSet
      name: wide-ep-lws-nvidia-gpu-vllm-dsv41-flash
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
