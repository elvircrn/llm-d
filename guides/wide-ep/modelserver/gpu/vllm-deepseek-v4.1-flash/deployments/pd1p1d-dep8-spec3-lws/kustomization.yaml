# pd1p1d-dep8-spec3-lws: the pd1p1d-dep8-spec3 shape for clusters whose
# namespace tenants cannot create DisaggregatedSets (waldorf's no-gains
# tenants) — the same two role pods deployed as plain LeaderWorkerSets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../pd-shared
  - leaderworkerset-prefill.yaml
  - leaderworkerset-decode.yaml

components:
  - ../../../../../../recipes/modelserver/components/images/gpu-vllm/nightly

# The routing sidecar has no campaign-side image override, so pin it here
# by digest: v0.11.0, the version the P/D reference measurements ran with.
images:
  - name: REPLACE_ROUTING_SIDECAR_IMAGE
    newName: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    newTag: v0.11.0
    digest: sha256:54de89ed8896a9dee4e67f11304bc5ad70c68ba2d2f0b40e5af92ec1e3e78fcc
