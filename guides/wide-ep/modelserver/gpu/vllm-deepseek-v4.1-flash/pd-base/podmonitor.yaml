# The decode engines answer on vllm-rank* (8200 + rank) behind the routing
# sidecar, so the decode PodMonitor must not match the sidecar's rank* ports.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-dsv41-flash-prefill
spec:
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: DeepSeek-V4.1-Flash
      llm-d.ai/role: prefill
  podMetricsEndpoints:
    - port: rank0
      path: /metrics
      interval: 5s
    - port: rank1
      path: /metrics
      interval: 5s
    - port: rank2
      path: /metrics
      interval: 5s
    - port: rank3
      path: /metrics
      interval: 5s
    - port: rank4
      path: /metrics
      interval: 5s
    - port: rank5
      path: /metrics
      interval: 5s
    - port: rank6
      path: /metrics
      interval: 5s
    - port: rank7
      path: /metrics
      interval: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-dsv41-flash-decode
spec:
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: DeepSeek-V4.1-Flash
      llm-d.ai/role: decode
  podMetricsEndpoints:
    - port: vllm-rank0
      path: /metrics
      interval: 5s
    - port: vllm-rank1
      path: /metrics
      interval: 5s
    - port: vllm-rank2
      path: /metrics
      interval: 5s
    - port: vllm-rank3
      path: /metrics
      interval: 5s
    - port: vllm-rank4
      path: /metrics
      interval: 5s
    - port: vllm-rank5
      path: /metrics
      interval: 5s
    - port: vllm-rank6
      path: /metrics
      interval: 5s
    - port: vllm-rank7
      path: /metrics
      interval: 5s
