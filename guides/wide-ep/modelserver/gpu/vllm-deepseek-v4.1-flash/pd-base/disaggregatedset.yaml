                  - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  # CoreWeave H200 nodes name their InfiniBand HCAs ibp0..ibp7.
                  - name: NCCL_IB_HCA
                    value: ibp
                  # Keeps numpy from re-enabling huge pages the THP wrapper
                  # turned off.
                  - name: NUMPY_MADVISE_HUGEPAGE
                    value: "0"
                  - name: VLLM_CACHE_ROOT
                    value: /var/cache/vllm/vllm
                  - name: TRITON_CACHE_DIR
                    value: /var/cache/vllm/triton
                  - name: TORCHINDUCTOR_CACHE_DIR
                    value: /var/cache/vllm/inductor
                  - name: FLASHINFER_WORKSPACE_BASE
                    value: /var/cache/vllm/flashinfer
                  - name: TILELANG_CACHE_DIR
                    value: /var/cache/vllm/tilelang
                  - name: CUDA_CACHE_PATH
                    value: /var/cache/vllm/cuda
                  - name: XDG_CACHE_HOME
                    value: /var/cache/vllm/xdg
                ports:
                  - containerPort: 8200
                    name: vllm-rank0
                    protocol: TCP
                  - containerPort: 8201
                    name: vllm-rank1
                    protocol: TCP
                  - containerPort: 8202
                    name: vllm-rank2
                    protocol: TCP
                  - containerPort: 8203
                    name: vllm-rank3
                    protocol: TCP
                  - containerPort: 8204
                    name: vllm-rank4
                    protocol: TCP
                  - containerPort: 8205
                    name: vllm-rank5
                    protocol: TCP
                  - containerPort: 8206
                    name: vllm-rank6
                    protocol: TCP
                  - containerPort: 8207
                    name: vllm-rank7
                    protocol: TCP
                  - containerPort: 9256
                    name: supervisor
                    protocol: TCP
                  - containerPort: 5600
                    name: nixl
                    protocol: TCP
                startupProbe:
                  httpGet:
                    path: /health
                    port: supervisor
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 1440
                livenessProbe:
                  httpGet:
                    path: /health
                    port: supervisor
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: supervisor
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                resources:
                  limits:
                    cpu: 64
                    ephemeral-storage: 1Ti
                    memory: 1800Gi
                    nvidia.com/gpu: "8"
                    rdma/ib: "8"
                  requests:
                    cpu: 64
                    ephemeral-storage: 1Ti
                    memory: 1800Gi
                    nvidia.com/gpu: "8"
                    rdma/ib: "8"
