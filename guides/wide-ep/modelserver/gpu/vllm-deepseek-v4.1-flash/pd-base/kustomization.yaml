# Disaggregated prefill/decode base; requires LWS v0.11.0+ with the
# DisaggregatedSet CRD and controller installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - disaggregatedset.yaml
  - serviceAccount.yaml
  - podmonitor.yaml

# The schema teaches kustomize the DisaggregatedSet merge keys, so strategic
# merge patches anywhere in a build composing this base match roles,
# containers, volumes, and env entries by name instead of array index.
openapi:
  path: disaggregatedset-schema.json

components:
  - ../../../../../recipes/modelserver/components/images/gpu-vllm/nightly

# The routing sidecar has no campaign-side image override, so pin it here
# by digest: v0.11.0, the version the P/D reference measurements ran with.
images:
  - name: REPLACE_ROUTING_SIDECAR_IMAGE
    newName: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    newTag: v0.11.0
    digest: sha256:54de89ed8896a9dee4e67f11304bc5ad70c68ba2d2f0b40e5af92ec1e3e78fcc

labels:
  - pairs:
      llm-d.ai/model: DeepSeek-V4.1-Flash
      llm-d.ai/guide: wide-ep
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: nvidia
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
