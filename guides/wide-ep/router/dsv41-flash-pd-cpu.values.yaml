router:
  epp:
    image:
      tag: v1.0.0
    flags:
      allow-experimental-plugins: true
    pluginsConfigFile: "dsv41-flash-pd-cpu-config.yaml"
    pluginsCustomConfig:
      dsv41-flash-pd-cpu-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: token-producer
          parameters:
            modelName: deepseek-ai/DeepSeek-V4.1-Flash
            vllm:
              url: "http://dsv41-flash-render:8000"
        - type: endpoint-notification-source
        - type: metrics-data-source
          parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
        - type: core-metrics-extractor
        - type: inflight-load-producer
          parameters:
            prefixMatchInfoProducerName: precise-prefix-cache-producer
        - type: precise-prefix-cache-producer
          parameters:
            indexerConfig:
              kvBlockIndexConfig:
                inMemoryConfig:
                  podCacheSize: 128
              kvCacheBackendConfigs:
              - name: gpu
                weight: 1.0
              - name: cpu
                weight: 0.9
            tokenProcessorConfig:
              blockSizeTokens: 64
            speculativeIndexing: false
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 8
              discoverPods: true
              podDiscoveryConfig:
                socketPort: 5556
        - type: prefix-cache-affinity-filter
          parameters:
            prefixMatchInfoProducerName: precise-prefix-cache-producer
            affinityThreshold: 0.80
            maxTTFTPenaltyMs: 18000
            peakPrefillThroughput: 46000
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        dataLayer:
          sources:
            - pluginRef: metrics-data-source
              extractors:
                - pluginRef: core-metrics-extractor
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
