router:
  proxy:
    presets:
      envoy:
        configMap:
          name: infx-agg-envoy

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: DeepSeek-V4.1-Flash
