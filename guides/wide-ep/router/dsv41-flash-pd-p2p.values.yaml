# DeepSeek-V4.1-Flash disaggregated P/D serving with P2P KV-cache sharing:
# layer after guides/recipes/router/base.values.yaml and
# dsv41-flash-pd.values.yaml. On top of the flash P/D scheduling this adds
# the precise KV index (fed by the engines' per-rank ZMQ kv-events
# publishers), the token-producer that tokenizes each prompt against the
# prefill engines' render endpoints, and the p2p-source-producer that names
# a peer as the KV source when it out-caches the scheduled prefill engine
# by at least minCachedTokenDelta tokens. The decode routing sidecar
# (pd1p2d-p2p overlay) turns that header into a CPU-tier pull on the
# prefill leg.
router:
  epp:
    # Pin to a release that watches inference.networking.k8s.io, the only
    # group the chart's Role grants: v0.11.0 watches the legacy
    # inference.networking.x-k8s.io group and cannot sync its caches.
    image:
      tag: v1.0.0
    flags:
      allow-experimental-plugins: true
    pluginsConfigFile: "dsv41-flash-pd-p2p-config.yaml"
    pluginsCustomConfig:
      dsv41-flash-pd-p2p-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: token-producer
          parameters:
            modelName: deepseek-ai/DeepSeek-V4.1-Flash
            vllm:
              # Render Service deployed by the pd1p2d-p2p overlay; fronts
              # the prefill engines' /v1/completions/render endpoints.
              url: "http://dsv41-flash-render:8000"
        - type: endpoint-notification-source
        - type: metrics-data-source
          parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
        - type: core-metrics-extractor
        - type: inflight-load-producer
          parameters:
            # Discount each pod's in-flight prompt tokens by what the
            # precise index says it already caches, so the token-load-scorer
            # prices a pod by the tokens it would still have to prefill.
            prefixMatchInfoProducerName: precise-prefix-cache-producer
        - type: precise-prefix-cache-producer
          parameters:
            indexerConfig:
              kvBlockIndexConfig:
                inMemoryConfig:
                  # Per-key LRU of (endpoint, tier) holders; size it at
                  # discovered endpoints x tiers.
                  podCacheSize: 128
              kvCacheBackendConfigs:
              - name: gpu
                weight: 1.0
              # A CPU-resident prefix is nearly as cheap to serve as a
              # GPU-resident one once the pull exists, so it is weighted
              # close to the GPU tier.
              - name: cpu
                weight: 0.9
            tokenProcessorConfig:
              blockSizeTokens: 64
            speculativeIndexing: false
            kvEventsConfig:
              topicFilter: "kv@"
              concurrency: 8
              discoverPods: true
              podDiscoveryConfig:
                socketPort: 5556
        - type: p2p-source-producer
          parameters:
            prefixMatchInfoProducerName: precise-prefix-cache-producer
            # The source comparison runs against the profile that will
            # actually compute the prefix.
            prefillProfileName: prefill
            # Minimum extra cached-prefix tokens a peer must hold beyond
            # the scheduled pod before a pull is requested; set from the
            # measured pull-versus-recompute crossover.
            minCachedTokenDelta: 2048
        - type: prefix-cache-affinity-filter
          parameters:
            prefixMatchInfoProducerName: precise-prefix-cache-producer
            affinityThreshold: 0.80
            maxTTFTPenaltyMs: 18000
            # Per-rank 8192-token prefill velocity on GB200.
            peakPrefillThroughput: 46000
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        dataLayer:
          sources:
            - pluginRef: metrics-data-source
              extractors:
                - pluginRef: core-metrics-extractor
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
