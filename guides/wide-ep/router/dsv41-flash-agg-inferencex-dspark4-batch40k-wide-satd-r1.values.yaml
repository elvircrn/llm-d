router:
  proxy:
    presets:
      envoy:
        configMap:
          name: infx-agg-ds4b40wsatdr1-envoy

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    replicas: 1
    pluginsConfigFile: "dsv41-flash-agg-inferencex-dspark4-batch40k-wide-satd-r1-config.yaml"
    pluginsCustomConfig:
      dsv41-flash-agg-inferencex-dspark4-batch40k-wide-satd-r1-config.yaml: |
        # The nyann synthetic isl-1 prompt is byte-identical for every
        # request, so prefix-cache affinity pins the whole probe to the one
        # endpoint that served the first request; a decode saturation probe
        # runs no affinity filter.
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: inflight-load-producer
        - type: token-load-scorer
          parameters:
            queueThresholdTokens: 500000
        - type: weighted-random-picker
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: token-load-scorer
          - pluginRef: weighted-random-picker

  modelServers:
    targetPorts:
      - number: 8000
      - number: 8001
      - number: 8002
      - number: 8003
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: DeepSeek-V4.1-Flash
      llm-d.ai/variant: dspark4-batch40k-wide-satd-r1
