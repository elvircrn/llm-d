# DeepSeek-V4.1-Flash aggregated serving: layer after
# guides/recipes/router/base.values.yaml. No prefill/decode roles exist, so
# none of the wide-ep pd plugins apply; the profile is the default-load
# shape (queue, KV-cache-utilization and prefix scorers) plus the
# active-request scorer, one endpoint per DP rank on ports 8000-8001.
# The scorer's registered type is kv-cache-utilization-scorer (llm-d-router
# pkg/epp/framework/plugins/scheduling/scorer/kvcacheutilization).
# metrics-data-source + core-metrics-extractor feed all four scorers; a
# profile with the scorers but no data source scores every endpoint neutral
# and routes blind (the chart's default-plugins.yaml pairs them for this
# reason).
router:
  # The chart's Service exposes only 9002/9090/8081; benchmark clients call
  # http://<release>-epp.<ns>.svc.cluster.local/v1 on port 80, so map it to
  # the Envoy sidecar (wide-ep.values.yaml does the same for the pd guides).
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "dsv41-flash-config.yaml"
    pluginsCustomConfig:
      dsv41-flash-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: metrics-data-source
          parameters:
            scheme: "http"
            path: "/metrics"
        - type: core-metrics-extractor
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: active-request-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: active-request-scorer
            weight: 2

  modelServers:
    targetPorts:
      - number: 8000
      - number: 8001
    matchLabels:
      llm-d.ai/guide: "wide-ep"
      llm-d.ai/model: "DeepSeek-V4.1-Flash"
