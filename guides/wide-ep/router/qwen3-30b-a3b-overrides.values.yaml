# Qwen3-30B-A3B: DP=4 per role on a single 8-GPU H200 node. Layer after
# wide-ep.values.yaml.
router:
  epp:
    # The plugin config is one string, so it is restated in full; only the rollout screener's
    # scope differs, pointing at the Qwen3-30B-A3B DisaggregatedSet instead of the default one.
    pluginsCustomConfig:
      wide-ep-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        # Pin each request to a single DisaggregatedSet revision during
        # rollouts so prefill and decode never pair across revisions.
        - type: disaggregatedset-rollout-screener
          parameters:
            scope:
              labelSelector: "disaggregatedset.x-k8s.io/name=wide-ep-vllm-qwen3-30b-a3b"
            revisionGating:
              mode: max-role
              requiredRoles: [prefill, decode]
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: active-request-scorer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: active-request-scorer
            weight: 2
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer

  modelServers:
    # DP=4 per role: prefill's API servers listen on 8000-8003 and decode's routing sidecar
    # fronts 8000-8003. Listing 8004-8007 would target dead ports.
    targetPorts:
      - number: 8000
      - number: 8001
      - number: 8002
      - number: 8003
    matchLabels:
      llm-d.ai/guide: "wide-ep"
      llm-d.ai/model: "Qwen3-30B-A3B"
