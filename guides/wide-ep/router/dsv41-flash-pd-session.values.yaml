router:
  epp:
    image:
      registry: quay.io
      repository: rh-ee-ecrncevi/llm-d
      tag: epp-d33b997b
    flags:
      allow-experimental-plugins: true
    pluginsConfigFile: dsv41-flash-pd-session-config.yaml
    pluginsCustomConfig:
      dsv41-flash-pd-session-config.yaml: "apiVersion: llm-d.ai/v1alpha1\nkind: EndpointPickerConfig\n\
        plugins:\n- type: always-disagg-pd-decider\n- type: disagg-profile-handler\n\
        \  parameters:\n    deciders:\n      prefill: always-disagg-pd-decider\n-\
        \ type: token-producer\n  parameters:\n    modelName: deepseek-ai/DeepSeek-V4.1-Flash\n\
        \    vllm:\n      endpointDiscovery:\n        portRules:\n        - selector:\n\
        \            matchLabels:\n              llm-d.ai/role: prefill\n        \
        \  basePort: 8000\n        - selector:\n            matchLabels:\n       \
        \       llm-d.ai/role: decode\n          basePort: 8200\n        loadBalancer:\n\
        \          type: round-robin\n        attemptTimeout: 10s\n      prefixCache:\n\
        \        enabled: true\n        maxEntries: 8192\n        maxBytes: 4294967296\n\
        \        asyncWarm:\n          concurrency: 16\n          timeout: 30s\n-\
        \ type: endpoint-notification-source\n- type: metrics-data-source\n  parameters:\n\
        \    scheme: http\n    path: /metrics\n    insecureSkipVerify: true\n- type:\
        \ core-metrics-extractor\n- type: inflight-load-producer\n  parameters:\n\
        \    prefixMatchInfoProducerName: precise-prefix-cache-producer\n- type: precise-prefix-cache-producer\n\
        \  parameters:\n    indexerConfig:\n      kvBlockIndexConfig:\n        enableMetrics:\
        \ true\n        inMemoryConfig:\n          size: 16000000\n          podCacheSize:\
        \ 1024\n      kvCacheBackendConfigs:\n      - name: gpu\n        weight: 1.0\n\
        \      - name: cpu\n        weight: 0.7\n    tokenProcessorConfig:\n     \
        \ blockSizeTokens: 64\n      hashSeed: '0'\n    speculativeIndexing: false\n\
        \    kvEventsConfig:\n      topicFilter: kv@\n      concurrency: 8\n     \
        \ discoverPods: true\n      podDiscoveryConfig:\n        socketPort: 5556\n\
        - type: prefill-filter\n- type: decode-filter\n- type: prefix-cache-affinity-filter\n\
        \  parameters:\n    prefixMatchInfoProducerName: precise-prefix-cache-producer\n\
        \    affinityThreshold: 0.6\n    maxTTFTPenaltyMs: 30000\n    peakPrefillThroughput:\
        \ 60000\n- type: token-load-scorer\n- type: active-request-scorer\n- type:\
        \ max-score-picker\ndataLayer:\n  sources:\n  - pluginRef: metrics-data-source\n\
        \    extractors:\n    - pluginRef: core-metrics-extractor\n  - pluginRef:\
        \ endpoint-notification-source\n    extractors:\n    - pluginRef: precise-prefix-cache-producer\n\
        schedulingProfiles:\n- name: prefill\n  plugins:\n  - pluginRef: prefill-filter\n\
        \  - pluginRef: prefix-cache-affinity-filter\n  - pluginRef: token-load-scorer\n\
        \  - pluginRef: max-score-picker\n- name: decode\n  plugins:\n  - pluginRef:\
        \ decode-filter\n  - pluginRef: active-request-scorer\n  - pluginRef: max-score-picker\n"
