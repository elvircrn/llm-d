# Router values for the Pirate (RDU4) Qwen3-4B aggregated campaign.
# Layered on guides/recipes/router/base.values.yaml, which keeps the chart's
# default aggregated plugin set (no prefill/decode role filters).
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  modelServers:
    matchLabels:
      llm-d.ai/model: Qwen3-4B-Instruct
    targetPorts:
      - number: 8000
